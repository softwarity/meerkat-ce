{{- if and .Values.admin.password (not .Values.admin.existingSecret) }}
# Read ONCE, on the first start, to create the admin account. It is never read
# again - which is why leaving it here afterwards is harmless, and why rotating
# it does nothing (change the password in the console instead).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "meerkat.fullname" . }}-admin
  labels: {{- include "meerkat.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.admin.password | quote }}
{{- end }}
{{- if or (and .Values.database.url (not .Values.database.existingSecret)) (and .Values.vault.key (not .Values.vault.existingSecret)) }}
---
# What a clustered gateway needs on every pod: where the shared state is, and
# the key that seals what is in it. Both belong in a Secret you create rather
# than in a values file you commit - `--set` them, or point at a Secret of
# your own with database.existingSecret / vault.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-state" (include "meerkat.fullname" .) }}
  labels: {{- include "meerkat.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and .Values.database.url (not .Values.database.existingSecret) }}
  {{ .Values.database.existingSecretKey }}: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if and .Values.vault.key (not .Values.vault.existingSecret) }}
  {{ .Values.vault.existingSecretKey }}: {{ .Values.vault.key | quote }}
  {{- end }}
{{- end }}
