# Three planes, three Services, on purpose: an Ingress put in front of the
# application plane must not be able to reach the console by accident, and
# publishing the console must not publish what the backends call.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meerkat.fullname" . }}
  labels: {{- include "meerkat.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "meerkat.selectorLabels" . | nindent 4 }}
  ports:
    - name: app
      port: {{ .Values.service.appPort }}
      targetPort: app
      {{- with .Values.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
    {{- with .Values.service.appTlsPort }}
    # HTTPS, published by default: TLS is configured from the console, and a
    # certificate posted there must not wait for somebody to edit a chart.
    - name: app-tls
      port: {{ . }}
      targetPort: app-tls
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meerkat.fullname" . }}-admin
  labels: {{- include "meerkat.labels" . | nindent 4 }}
spec:
  # ClusterIP unless an installation says otherwise. The console is not a thing
  # to publish by accident - hence a separate setting rather than the one above,
  # which an Ingress in front of the application plane would drag along with it.
  # But it is not the chart's business to forbid it either: reaching it through
  # a port-forward ties a tunnel to ONE pod, so every rollout breaks it, and an
  # operator ends up relaunching a command instead of opening a bookmark.
  type: {{ .Values.service.adminType | default "ClusterIP" }}
  selector: {{- include "meerkat.selectorLabels" . | nindent 4 }}
  ports:
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: admin
      {{- with .Values.service.adminNodePort }}
      nodePort: {{ . }}
      {{- end }}
    {{- with .Values.service.adminTlsPort }}
    - name: admin-tls
      port: {{ . }}
      targetPort: admin-tls
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meerkat.fullname" . }}-internal
  labels: {{- include "meerkat.labels" . | nindent 4 }}
  {{- if and .Values.internalTls.openshiftServingCert (not .Values.internalTls.secretName) }}
  annotations:
    # OpenShift's service CA issues a certificate for this Service's names
    # into this Secret, and renews it.
    service.beta.openshift.io/serving-cert-secret-name: {{ include "meerkat.fullname" . }}-internal-tls
  {{- end }}
spec:
  # ClusterIP, and no setting: the services of this cluster call it - the
  # JWKS, the scheduler's API - and nothing else has a reason to. A
  # NetworkPolicy can then keep the backends away from the console without
  # keeping them away from this.
  type: ClusterIP
  selector: {{- include "meerkat.selectorLabels" . | nindent 4 }}
  ports:
    - name: internal
      port: {{ .Values.service.internalPort | default 7070 }}
      targetPort: internal
    - name: internal-tls
      port: {{ .Values.service.internalTlsPort | default 7443 }}
      targetPort: internal-tls
{{- if .Values.plug.enabled }}
---
# The developer tunnel. How your developers reach it is a network decision, so
# the chart asks for the Service type rather than assuming one.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meerkat.fullname" . }}-plug
  labels: {{- include "meerkat.labels" . | nindent 4 }}
spec:
  type: {{ .Values.plug.service.type }}
  selector: {{- include "meerkat.selectorLabels" . | nindent 4 }}
  ports:
    - name: plug
      port: {{ .Values.plug.port }}
      targetPort: plug
      {{- with .Values.plug.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
{{- end }}
