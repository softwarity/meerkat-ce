{{- /* trustedProxies was removed (SSL-14): said once, plainly, rather than
       ignored - a value that silently stopped working would change whose
       addresses the gateway believes without a word. */ -}}
{{- if hasKey .Values "trustedProxies" }}
{{- if .Values.trustedProxies }}
{{- fail "trustedProxies was removed: declare the proxy in front of each plane, and its addresses, on the console's Domains & TLS screen (Infra), then remove trustedProxies from your values" }}
{{- end }}
{{- end }}
{{- if and (gt (int .Values.replicaCount) 1) (not (include "meerkat.clustered" .)) }}
{{- fail "replicaCount above 1 needs the shared database: set database.url or database.existingSecret (Enterprise image), or leave replicaCount at 1 on its own volume - several pods on the embedded store are several gateways, not one" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meerkat.fullname" . }}
  labels: {{- include "meerkat.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if include "meerkat.clustered" . }}
    # The state is in the database and sessions live there too, so a pod that
    # leaves takes nobody's session with it: replace them one at a time,
    # without ever going below the count asked for.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- else }}
    # The store is a file on a ReadWriteOnce volume, so two gateways cannot
    # hold it at once: the old pod goes before the new one arrives.
    type: Recreate
    {{- end }}
  selector:
    matchLabels: {{- include "meerkat.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "meerkat.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "meerkat.fullname" . }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: meerkat
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          args: ["-data", "/data"]
          ports:
            - name: app
              containerPort: 8080
            - name: admin
              containerPort: 9090
            # The internal plane: the JWKS and the scheduler's API, for the
            # services of this cluster.
            - name: internal
              containerPort: 7070
            - name: internal-tls
              containerPort: 7443
            # The HTTPS doors. They open once a certificate is posted (Infra,
            # TLS); until then the published ports refuse the connection.
            - name: app-tls
              containerPort: 8443
            - name: admin-tls
              containerPort: 9443
            {{- if .Values.plug.enabled }}
            - name: plug
              containerPort: {{ .Values.plug.port }}
            {{- end }}
          env:
            {{- if .Values.plug.enabled }}
            # This pod's own address, for the tunnel: a parked Service names the
            # replica serving it, and every replica's sweep calls that address.
            # Without it plug guesses the address from a route to the API server.
            - name: PLUG_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- end }}
            {{- with include "meerkat.trustProbe" . }}
            # The throwaway Certificate it may ask cert-manager for, to learn
            # an issuer's certificate (SSL-09): the name the Role grants.
            - name: MEERKAT_TRUST_PROBE
              value: {{ . | quote }}
            {{- end }}
            {{- with include "meerkat.issuedSecret" . }}
            # The Certificate it may ask cert-manager for (SSL-13), and the
            # Secret it reads: the name the Role below is granted on.
            - name: MEERKAT_CERT_MANAGER_SECRET
              value: {{ . | quote }}
            {{- end }}
            {{- $watched := ((.Values.rbac | default dict).watchNamespaces | default list) }}
            {{- if and $watched (ne ((.Values.rbac | default dict).watch) false) }}
            # The other namespaces the runtime watcher follows, beside its own:
            # the ones the chart granted it (rbac.watchNamespaces).
            - name: MEERKAT_WATCH_NAMESPACES
              value: {{ join "," $watched | quote }}
            {{- end }}
            {{- if include "meerkat.clustered" . }}
            # The shared state. This line is what makes several pods ONE
            # gateway instead of several.
            - name: MEERKAT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "meerkat.stateSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- end }}
            {{- if or .Values.vault.key .Values.vault.existingSecret }}
            # The vault's master key, THE SAME on every pod.
            - name: MEERKAT_VAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "meerkat.vaultSecretName" . }}
                  key: {{ .Values.vault.existingSecretKey }}
            # The key a rotation replaces, read only while it is there. Its
            # name defaults HERE as well as in values.yaml: an upgrade with
            # --reuse-values keeps the old values and skips the new defaults.
            - name: MEERKAT_VAULT_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ include "meerkat.vaultSecretName" . }}
                  key: {{ .Values.vault.existingSecretPreviousKey | default "vault-key-previous" }}
                  optional: true
            {{- end }}
            {{- if or .Values.admin.password .Values.admin.existingSecret }}
            - name: MEERKAT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "meerkat.adminSecretName" . }}
                  key: {{ .Values.admin.existingSecretKey }}
            {{- end }}
            {{- if (.Values.license).existingSecret }}
            # The license, read from the mounted Secret below.
            - name: MEERKAT_LICENSE_FILE
              value: /etc/meerkat/license/{{ .Values.license.existingSecretKey | default "license" }}
            {{- end }}
            {{- if .Values.plug.enabled }}
            - name: MEERKAT_PLUG_ADDR
              value: ":{{ .Values.plug.port }}"
            {{- end }}
          # The store is opened and migrated BEFORE the ports open, so a long
          # migration answers nothing for a while: up to two minutes before
          # liveness starts counting, rather than a restart in mid-migration.
          #
          # Run INSIDE the container, on the loopback (`meerkat health`, the
          # image has no shell): the application's plain port may be switched
          # off on the Domains & TLS screen (SSL-15), and then it listens on
          # the loopback only - out of the kubelet's reach, never of the
          # gateway's own probe.
          startupProbe:
            exec: { command: ["/meerkat", "health", "http://127.0.0.1:8080/healthz"] }
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            exec: { command: ["/meerkat", "health", "http://127.0.0.1:8080/healthz"] }
            timeoutSeconds: 5
          readinessProbe:
            exec: { command: ["/meerkat", "health", "http://127.0.0.1:8080/readyz"] }
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if include "meerkat.internalTlsSecret" . }}
            # Never through subPath: the kubelet only rewrites a whole volume,
            # and a renewal is what this mount is for.
            - name: internal-tls
              mountPath: /etc/meerkat/tls/internal
              readOnly: true
            {{- end }}
            {{- if (.Values.license).existingSecret }}
            # The whole Secret, never a subPath: an update in place reaches the
            # pod only through a mounted volume.
            - name: license
              mountPath: /etc/meerkat/license
              readOnly: true
            {{- end }}
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- with (.Values.license).existingSecret }}
        - name: license
          secret:
            secretName: {{ . }}
        {{- end }}
        {{- with include "meerkat.internalTlsSecret" . }}
        - name: internal-tls
          secret:
            secretName: {{ . }}
            # Optional: the service CA writes it after the Service exists, and
            # the pod must not wait for it to start.
            optional: true
        {{- end }}
        - name: data
          {{- if and .Values.persistence.enabled (not (include "meerkat.clustered" .)) }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "meerkat.fullname" .)) }}
          {{- else if include "meerkat.clustered" . }}
          # Clustered: what the gateway knows is in the database, and this
          # directory holds nothing that outlives the pod.
          emptyDir: {}
          {{- else }}
          # No volume asked for: everything the gateway learns dies with the
          # pod. Fine for a demo, never for anything else.
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if gt (int .Values.replicaCount) 1 }}
      # Spread them: three pods on one node answer a node's failure the same
      # way one pod does. A preference, not a demand - a cluster smaller than
      # the count asked for must still schedule.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {{- include "meerkat.selectorLabels" . | nindent 20 }}
      {{- end }}
