{{- if and (gt (int .Values.replicaCount) 1) (not (include "meerkat.clustered" .)) }}
{{- fail "replicaCount above 1 needs the shared database: set database.url or database.existingSecret (Enterprise image), or leave replicaCount at 1 on its own volume - several pods on the embedded store are several gateways, not one" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meerkat.fullname" . }}
  labels: {{- include "meerkat.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if include "meerkat.clustered" . }}
    # The state is in the database and sessions live there too, so a pod that
    # leaves takes nobody's session with it: replace them one at a time,
    # without ever going below the count asked for.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    {{- else }}
    # The store is a file on a ReadWriteOnce volume, so two gateways cannot
    # hold it at once: the old pod goes before the new one arrives.
    type: Recreate
    {{- end }}
  selector:
    matchLabels: {{- include "meerkat.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "meerkat.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "meerkat.fullname" . }}
      containers:
        - name: meerkat
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-data", "/data"]
          ports:
            - name: app
              containerPort: 8080
            - name: admin
              containerPort: 9090
            {{- if .Values.plug.enabled }}
            - name: plug
              containerPort: {{ .Values.plug.port }}
            {{- end }}
          env:
            {{- if include "meerkat.clustered" . }}
            # The shared state. This line is what makes several pods ONE
            # gateway instead of several.
            - name: MEERKAT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "meerkat.stateSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- end }}
            {{- if or .Values.vault.key .Values.vault.existingSecret }}
            # The vault's master key, THE SAME on every pod.
            - name: MEERKAT_VAULT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "meerkat.vaultSecretName" . }}
                  key: {{ .Values.vault.existingSecretKey }}
            {{- end }}
            {{- if or .Values.admin.password .Values.admin.existingSecret }}
            - name: MEERKAT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "meerkat.adminSecretName" . }}
                  key: {{ .Values.admin.existingSecretKey }}
            {{- end }}
            {{- if .Values.production }}
            - name: MEERKAT_PRODUCTION
              value: "1"
            {{- end }}
            {{- if .Values.plug.enabled }}
            - name: MEERKAT_PLUG_ADDR
              value: ":{{ .Values.plug.port }}"
            {{- end }}
          livenessProbe:
            httpGet: { path: /healthz, port: app }
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: { path: /readyz, port: app }
          volumeMounts:
            - name: data
              mountPath: /data
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: data
          {{- if and .Values.persistence.enabled (not (include "meerkat.clustered" .)) }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "meerkat.fullname" .)) }}
          {{- else if include "meerkat.clustered" . }}
          # Clustered: what the gateway knows is in the database, and this
          # directory holds nothing that outlives the pod.
          emptyDir: {}
          {{- else }}
          # No volume asked for: everything the gateway learns dies with the
          # pod. Fine for a demo, never for anything else.
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{- toYaml .Values.affinity | nindent 8 }}
      {{- else if gt (int .Values.replicaCount) 1 }}
      # Spread them: three pods on one node answer a node's failure the same
      # way one pod does. A preference, not a demand - a cluster smaller than
      # the count asked for must still schedule.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {{- include "meerkat.selectorLabels" . | nindent 20 }}
      {{- end }}
