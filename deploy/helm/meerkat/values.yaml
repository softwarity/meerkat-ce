image:
  # Two images, two products, built from the same commit: the community one on
  # Docker Hub, the Enterprise one on GitHub Packages (private - the pull
  # secret below is how a cluster reaches it).
  repository: docker.io/softwarity/meerkat
  tag: "" # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
  pullSecrets: []

# How many gateways serve this installation. One is the default shape: a pod
# on its own volume, holding everything it knows. More than one is a CLUSTER,
# and a cluster needs the shared database below - three pods on three volumes
# are three gateways, not one, and nothing would look broken while they
# disagreed.
replicaCount: 1

# The shared state: routes, accounts, sessions, the audit trail and the sealed
# vault become rows, and that is what makes several pods ONE gateway. It is
# also the whole coordination - PostgreSQL's own notifications are the bus, so
# there is no Redis, no broker and no etcd to run beside it.
#
# Enterprise: the community image links no PostgreSQL driver, so a URL given
# to it answers with a sentence naming what IS available rather than a driver
# error. Either give the URL here, or name a Secret you manage yourself.
database:
  url: ""
  existingSecret: ""
  existingSecretKey: database-url

# The vault's master key. It seals what is IN the database, so it is not kept
# there. Left to itself each pod generates its own, in its own directory - and
# then a secret sealed by one pod is unreadable by the others, which shows up
# as an upstream password that works on one replica in three.
#
# Generate it once (openssl rand -hex 32), give every pod the same, and keep
# it where you keep your keys: losing it loses every secret in the vault.
vault:
  key: ""
  existingSecret: ""
  existingSecretKey: vault-key

# The FIRST admin account, created on the first start and never read again.
# Either give a password here (the chart makes a Secret) or name a Secret you
# manage yourself - never both.
admin:
  password: ""
  existingSecret: ""
  existingSecretKey: password

# Declare this gateway a PRODUCTION one: the whole developer surface stays
# closed here whatever the database says. Worth setting even when nobody
# expects a developer tunnel - the stored switch travels in a backup or a
# configuration export, and this does not.
production: false

# The developer tunnel (Enterprise only): plug, compiled into the gateway.
#
# It needs one right - manage Services in this namespace - and that grant is
# the whole contract. On, the chart grants it; off, it grants nothing.
plug:
  enabled: false
  port: 22222
  service:
    # ClusterIP, NodePort or LoadBalancer. How your developers reach the
    # tunnel is a network decision, so the chart asks rather than assumes.
    type: ClusterIP
    nodePort: ""

service:
  type: ClusterIP
  appPort: 8080   # application plane: what your users reach
  adminPort: 9090 # control plane: the admin console, keep it internal

persistence:
  # Everything the gateway knows lives here: routes, accounts, the sealed
  # vault, the certificates. Without a volume, a restarted pod is a new
  # installation.
  #
  # Ignored once `database` is set: the state is then rows, the directory
  # holds nothing worth keeping, and a ReadWriteOnce volume cannot follow a
  # pod from one machine to another anyway.
  enabled: true
  size: 2Gi
  storageClass: ""
  existingClaim: ""

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
