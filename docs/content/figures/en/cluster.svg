<svg class="dg" viewBox="0 0 1000 560" role="img" aria-label="Users and API clients reach an ingress, the only published point of the cluster. Behind it, three Meerkat replicas serve the same routes to four internal services: two interfaces and two APIs. The replicas share one PostgreSQL. An operator reaches the console on the other port.">
  <defs>
    <marker id="ah-cl" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ahmk-cl" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-mk" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="divider" fill="none" x="55" y="105" width="690" height="425" rx="16"/>
  <text class="t-sub" x="74" y="130">your cluster</text>
  <rect class="box" x="95" y="14" width="210" height="54" rx="10"/>
  <text class="t-head" x="200" y="38" text-anchor="middle">Browser</text>
  <text class="t-sub" x="200" y="56" text-anchor="middle">your users</text>
  <rect class="box" x="330" y="14" width="210" height="54" rx="10"/>
  <text class="t-head" x="435" y="38" text-anchor="middle">API client</text>
  <text class="t-sub" x="435" y="56" text-anchor="middle">integrations, machines</text>
  <rect class="box-other" x="790" y="14" width="170" height="54" rx="10"/>
  <text class="t-head" x="875" y="38" text-anchor="middle">Operator</text>
  <text class="t-sub" x="875" y="56" text-anchor="middle">or an AI agent</text>
  <path class="edge-mk" d="M200 68 L200 150" marker-end="url(#ahmk-cl)"/>
  <path class="edge-mk" d="M435 68 L435 150" marker-end="url(#ahmk-cl)"/>
  <text class="t-mono" x="212" y="112">:8080  applications</text>
  <rect class="box" x="150" y="150" width="470" height="52" rx="10"/>
  <text class="t-head" x="385" y="174" text-anchor="middle">Ingress, or your load balancer</text>
  <text class="t-sub" x="385" y="192" text-anchor="middle">the only published point</text>
  <path class="edge-dash" d="M875 68 L875 272 L659 272" marker-end="url(#ah-cl)"/>
  <text class="t-mono" x="866" y="112" text-anchor="end">:9090  console</text>
  <text class="t-sub" x="75" y="220">three interchangeable replicas</text>
  <rect class="box-mk" x="75" y="248" width="180" height="82" rx="12"/>
  <text class="t-title t-mk" x="165" y="284" text-anchor="middle">meerkat</text>
  <text class="t-mono" x="165" y="306" text-anchor="middle">:8080  :9090</text>
  <path class="edge" d="M385 202 L385 226 L165 226 L165 246" marker-end="url(#ah-cl)"/>
  <path class="edge" d="M165 330 L165 352"/>
  <rect class="box-mk" x="275" y="248" width="180" height="82" rx="12"/>
  <text class="t-title t-mk" x="365" y="284" text-anchor="middle">meerkat</text>
  <text class="t-mono" x="365" y="306" text-anchor="middle">:8080  :9090</text>
  <path class="edge" d="M385 202 L385 226 L365 226 L365 246" marker-end="url(#ah-cl)"/>
  <path class="edge" d="M365 330 L365 352"/>
  <rect class="box-mk" x="475" y="248" width="180" height="82" rx="12"/>
  <text class="t-title t-mk" x="565" y="284" text-anchor="middle">meerkat</text>
  <text class="t-mono" x="565" y="306" text-anchor="middle">:8080  :9090</text>
  <path class="edge" d="M385 202 L385 226 L565 226 L565 246" marker-end="url(#ah-cl)"/>
  <path class="edge" d="M565 330 L565 352"/>
  <path class="edge" d="M120 352 L650 352"/>
  <path class="edge" d="M150 352 L150 398" marker-end="url(#ah-cl)"/>
  <path class="edge" d="M315 352 L315 398" marker-end="url(#ah-cl)"/>
  <path class="edge" d="M480 352 L480 398" marker-end="url(#ah-cl)"/>
  <path class="edge" d="M645 352 L645 398" marker-end="url(#ah-cl)"/>
  <text class="t-edge" x="158" y="376">UI routes</text>
  <text class="t-edge" x="488" y="376">API routes</text>
  <rect class="box" x="75" y="400" width="150" height="56" rx="10"/>
  <text class="t-head" x="150" y="424" text-anchor="middle">orders-ui</text>
  <text class="t-mono" x="150" y="444" text-anchor="middle">Angular</text>
  <rect class="box" x="240" y="400" width="150" height="56" rx="10"/>
  <text class="t-head" x="315" y="424" text-anchor="middle">billing-ui</text>
  <text class="t-mono" x="315" y="444" text-anchor="middle">React</text>
  <rect class="box" x="405" y="400" width="150" height="56" rx="10"/>
  <text class="t-head" x="480" y="424" text-anchor="middle">orders-api</text>
  <text class="t-mono" x="480" y="444" text-anchor="middle">Go</text>
  <rect class="box" x="570" y="400" width="150" height="56" rx="10"/>
  <text class="t-head" x="645" y="424" text-anchor="middle">invoices-api</text>
  <text class="t-mono" x="645" y="444" text-anchor="middle">Java</text>
  <path class="divider" d="M397 398 L397 458"/>
  <text class="t-sub" x="397" y="482" text-anchor="middle">your services, unchanged</text>
  <path class="edge-dash" d="M657 308 L790 308 L790 420 L798 420" marker-end="url(#ah-cl)"/>
  <rect class="box-other" x="800" y="382" width="160" height="78" rx="10"/>
  <text class="t-head" x="880" y="408" text-anchor="middle">PostgreSQL</text>
  <text class="t-sub" x="880" y="427" text-anchor="middle">the shared state</text>
  <text class="t-sub" x="880" y="445" text-anchor="middle">sessions, routes, audit</text>
  <text class="t-mk" x="397" y="512" text-anchor="middle">None of your services is published: only the gateway is.</text>
</svg>
