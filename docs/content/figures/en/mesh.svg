<svg class="dg" viewBox="0 0 1000 600" role="img" aria-label="A browser and an API client reach Meerkat over HTTPS. Meerkat serves sign-in and sessions, decides access, routes, and forwards to four services: two user interfaces, which receive the portal and the account button, and two APIs, which receive a signed token carrying identity, roles and organisation. An operator reaches the console on the other port.">
  <defs>
    <marker id="ah-mesh" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ahmk-mesh" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="ah-mk" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="box" x="150" y="20" width="220" height="56" rx="10"/>
  <text class="t-head" x="260" y="44" text-anchor="middle">Browser</text>
  <text class="t-sub" x="260" y="62" text-anchor="middle">your users</text>
  <rect class="box" x="430" y="20" width="220" height="56" rx="10"/>
  <text class="t-head" x="540" y="44" text-anchor="middle">API client</text>
  <text class="t-sub" x="540" y="62" text-anchor="middle">integrations, machines</text>
  <rect class="box-other" x="770" y="20" width="200" height="56" rx="10"/>
  <text class="t-head" x="870" y="44" text-anchor="middle">Operator</text>
  <text class="t-sub" x="870" y="62" text-anchor="middle">or an AI agent</text>
  <path class="edge-mk" d="M260 76 L260 132" marker-end="url(#ahmk-mesh)"/>
  <path class="edge-mk" d="M540 76 L540 132" marker-end="url(#ahmk-mesh)"/>
  <path class="edge-dash" d="M870 76 L870 220 L716 220" marker-end="url(#ah-mesh)"/>
  <text class="t-mono" x="862" y="150" text-anchor="end">:9090  console</text>
  <text class="t-mono" x="272" y="112">:8080  applications</text>
  <rect class="box-mk" x="110" y="136" width="606" height="176" rx="14"/>
  <text class="t-title t-mk" x="142" y="176">Meerkat</text>
  <text class="t-sub" x="142" y="198">one binary, two ports</text>
  <text x="142" y="228">sign-in, MFA, SSO, sessions</text>
  <text x="142" y="250">access rules, roles, organisations</text>
  <text x="142" y="272">routing, rate limits, TLS, vault</text>
  <text x="142" y="294">audit, traffic, issue reports</text>
  <path class="edge" d="M260 312 L260 350 L170.0 350 L170.0 404" marker-end="url(#ah-mesh)"/>
  <path class="edge" d="M260 312 L260 350 L390.0 350 L390.0 404" marker-end="url(#ah-mesh)"/>
  <path class="edge" d="M540 312 L540 350 L610.0 350 L610.0 404" marker-end="url(#ah-mesh)"/>
  <path class="edge" d="M540 312 L540 350 L830.0 350 L830.0 404" marker-end="url(#ah-mesh)"/>
  <text class="t-edge" x="262" y="344">UI route</text>
  <text class="t-edge" x="542" y="344">API route</text>
  <rect class="box" x="75" y="408" width="190" height="58" rx="10"/>
  <text class="t-head" x="170.0" y="432" text-anchor="middle">orders-ui</text>
  <text class="t-mono" x="170.0" y="452" text-anchor="middle">Angular</text>
  <rect class="box" x="295" y="408" width="190" height="58" rx="10"/>
  <text class="t-head" x="390.0" y="432" text-anchor="middle">billing-ui</text>
  <text class="t-mono" x="390.0" y="452" text-anchor="middle">React</text>
  <rect class="box" x="515" y="408" width="190" height="58" rx="10"/>
  <text class="t-head" x="610.0" y="432" text-anchor="middle">orders-api</text>
  <text class="t-mono" x="610.0" y="452" text-anchor="middle">Go</text>
  <rect class="box" x="735" y="408" width="190" height="58" rx="10"/>
  <text class="t-head" x="830.0" y="432" text-anchor="middle">invoices-api</text>
  <text class="t-mono" x="830.0" y="452" text-anchor="middle">Java</text>
  <text class="t-sub" x="500" y="492" text-anchor="middle">your services, unchanged</text>
  <path class="divider" d="M500 408 L500 466"/>
  <text class="t-mk" x="75" y="528">+ they receive the portal, the account button, the theme</text>
  <text class="t-mk" x="75" y="548">and the colour scheme - and ship no library for it</text>
  <text class="t-mk" x="515" y="528">+ they receive a signed token: who is calling, their roles</text>
  <text class="t-mk" x="515" y="548">and their organisation - and they authenticate nobody</text>
</svg>
