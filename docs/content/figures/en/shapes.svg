  <path class="edge" d="M500 140 L500 168"/>
  <rect class="box" x="444" y="168" width="112" height="40" rx="10"/>
  <text class="t-sub" x="500" y="193" text-anchor="middle">its volume</text>
  <text class="t-sub" x="373" y="240">+ one pod, one volume</text>
