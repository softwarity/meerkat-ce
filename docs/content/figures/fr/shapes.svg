<svg class="dg" viewBox="0 0 1000 400" role="img" aria-label="Trois formes de déploiement côte à côte : une passerelle communautaire sur son volume, une passerelle Enterprise sur son volume avec le tunnel de développement, et trois passerelles Enterprise partageant un PostgreSQL.">
