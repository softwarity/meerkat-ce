# The smallest cluster that can be taken over from: a gateway with the agent
# in it, and one service to plug over.
services:
  meerkat:
    image: meerkat:ee
    environment:
      MEERKAT_ADMIN_PASSWORD: tunnel-Root-Password-1
      MEERKAT_DATA: /data
    # The socket is how the agent provisions a name and parks what held it.
    # Root because the socket is root's, which is also what the neo stack does
    # and for the reason written there.
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Published in HOST mode, not through the routing mesh. On a single-node CI
    # Swarm the mesh is the wrong machinery twice over: it needs a real
    # advertise address to relay anything, and it ACCEPTS a connection on a
    # published port before any task answers it - so a probe against it hangs
    # instead of failing, and a gateway that came up perfectly looked dead for
    # eight minutes. Host mode binds the node directly, and the port simply
    # does not exist until the task does.
    ports:
      - { target: 8080, published: 18080, protocol: tcp, mode: host }
      - { target: 9090, published: 19090, protocol: tcp, mode: host }
      - { target: 22222, published: 2222, protocol: tcp, mode: host }
    networks: [tunnel-net]
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

  # The service a developer takes over. Anything that answers HTTP and says
  # which of the two answered - the whole assertion is that the same name
  # reaches a different process afterwards.
  checkout:
    image: mccutchen/go-httpbin:latest
    networks: [tunnel-net]
    deploy:
      replicas: 1

networks:
  tunnel-net:
    external: true
