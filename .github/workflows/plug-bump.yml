# The plug release the Enterprise image hands out, moved when plug publishes one.
#
# plug's release job tells this repository (a repository_dispatch, with the
# version, sent with the org's release App that plug already uses). This runs
# `make plug V=...` - docker/plug.json, the agent module in go.mod, the
# Dockerfile's payload, a line of release notes - checks they agree, and pushes
# the commit to main. Nothing is released here: the commit goes through the CI
# like any other (on meerkat-ce, through the mirror), the e2e of the download
# account included, and the next release carries it, tested. When a plug
# release needs code on this side, it is that CI run that says so.
#
# Also by hand (workflow_dispatch, a version or the latest), and once a day in
# case a dispatch was lost: then it only acts when the latest release is not
# the one pinned, and costs a few seconds otherwise.
name: Hand out the latest plug

on:
  repository_dispatch:
    types: [plug-released]
  workflow_dispatch:
    inputs:
      version:
        description: plug release to hand out (x.y.z); the latest when empty
        required: false
  schedule:
    - cron: "23 6 * * *"

# One at a time: two releases announced close together land in order.
concurrency:
  group: plug-bump
  cancel-in-progress: false

permissions:
  # The bump commit, pushed to main.
  contents: write
  # A push made with this workflow's token starts no workflow, so the mirror -
  # and through it the CI - is started by hand, which that token may do.
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Which release, and is it already the one handed out
        id: which
        env:
          GH_TOKEN: ${{ github.token }}
          ASKED: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          set -e
          v="${ASKED#v}"
          if [ -z "$v" ]; then
            v=$(gh release view -R softwarity/plug --json tagName -q .tagName)
            v="${v#v}"
          fi
          case "$v" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$v' is not a plug release (x.y.z)"; exit 1 ;;
          esac
          current=$(jq -r .version docker/plug.json)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$v" = "$current" ]; then
            echo "plug $v is already the one handed out" >> "$GITHUB_STEP_SUMMARY"
            echo "move=false" >> "$GITHUB_OUTPUT"
          else
            echo "move=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.which.outputs.move == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Move docker/plug.json, go.mod, the Dockerfile and the notes
        if: steps.which.outputs.move == 'true'
        env:
          V: ${{ steps.which.outputs.version }}
        run: |
          set -e
          make plug V="$V"
          # The same check the CI makes, before anything is pushed.
          go test -run TestThePlugReleaseIsTheOneOfPlugJSON .
          go build -tags ee ./...

      - name: Commit, push, and start the mirror
        if: steps.which.outputs.move == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.which.outputs.version }}
        run: |
          set -e
          git config user.name "softwarity-bot"
          git config user.email "bot@softwarity.io"
          git add docker/plug.json go.mod go.sum docker/Dockerfile RELEASE_NOTES.md
          git commit -m "Hand out plug $V"
          # main may have moved while this ran: on top of it, or not at all.
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run mirror-ce.yml --ref main
          echo "plug $V handed out: $(git rev-parse --short HEAD), mirror started" >> "$GITHUB_STEP_SUMMARY"
