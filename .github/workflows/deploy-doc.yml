name: Deploy Doc to GitHub Pages
run-name: ${{ github.actor }} deploy doc on ${{ github.repository }}

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      # The Test coverage page renders the integration-test matrix verbatim.
      - 'e2e/scenarios.json'
      - '.github/workflows/deploy-doc.yml'
  # A release changes no docs/** file, so redeploy on it too - that regenerates
  # assets/version.json (the pinned tag shown in the snippets) from the new tag.
  release:
    types: [published]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

# The site lives on the PUBLIC mirror: softwarity.github.io/meerkat-ce/. This
# workflow is mirrored there verbatim, so it runs in both repositories - and on
# the private one there are no Pages to publish to, which is why every push
# touching docs/ was ending in a red "Setup Pages: Not Found".
#
# It still BUILDS in both, deliberately: a doc that stopped compiling would
# otherwise be discovered on the mirror, one push too late. Only the three
# publishing steps are held back.
env:
  PUBLISHES_PAGES: ${{ github.repository == 'softwarity/meerkat-ce' }}

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the tags so gen-version.mjs can resolve the latest release

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install doc-site deps
        working-directory: docs
        run: npm ci

      - name: Build doc-site for GitHub Pages
        working-directory: docs
        # The base href follows the REPOSITORY, because this workflow is
        # mirrored: served from softwarity.github.io/meerkat-ce/ with /meerkat/
        # baked in, every asset path lands one directory beside itself and the
        # page renders black.
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"

      - name: Setup Pages
        if: env.PUBLISHES_PAGES == 'true'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: env.PUBLISHES_PAGES == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: './docs/dist/doc-site/browser'

      - name: Deploy to GitHub Pages
        if: env.PUBLISHES_PAGES == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
