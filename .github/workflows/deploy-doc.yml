name: Deploy Doc to GitHub Pages
run-name: ${{ github.actor }} deploy doc on ${{ github.repository }}

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      # The Test coverage page renders the integration-test matrix verbatim.
      - 'e2e/scenarios.json'
      - '.github/workflows/deploy-doc.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

# The site is published from the PUBLIC mirror, softwarity/meerkat-ce, at its
# custom domain (www.softwarity.io) - the address says what it is whichever
# repository serves it.
#
# It was published from the private tree for a while, so the front door would
# not be a by-product of the source dump. What moved it back is the bill: the
# private repository pays every minute, the public one none, and a doc push is
# frequent. The custom domain is what keeps it a deliberate act - "meerkat-ce"
# appears nowhere in the address.

jobs:
  # The site is built and published from the PUBLIC mirror, softwarity/meerkat-ce,
  # where minutes are free. This file lives in both trees, and on the private one
  # the job is skipped - a skipped job bills nothing. A release changes no docs/
  # file here, but it does there: mirror-ce.yml writes the latest tag into
  # docs/.release-version, which is how the pinned version reaches the site.
  deploy:
    if: github.repository == 'softwarity/meerkat-ce'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the tags so gen-version.mjs can resolve the latest release

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install doc-site deps
        working-directory: docs
        run: npm ci

      - name: Build doc-site for GitHub Pages
        working-directory: docs
        # The ROOT, because the site answers on www.softwarity.io rather than
        # under a repository path. This is not cosmetic: with /meerkat/ baked
        # in, every asset lands one directory beside itself and the page
        # renders black. The CNAME that names the domain rides in the artifact
        # (docs/public/CNAME) - an Actions deployment that does not carry it
        # clears the custom domain it was just given.
        run: npm run build -- --base-href "/"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './docs/dist/doc-site/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
