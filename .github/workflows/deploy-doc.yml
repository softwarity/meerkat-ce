name: Deploy Doc
run-name: ${{ github.actor }} deploy doc on ${{ github.repository }}

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      # The Test coverage page renders the integration-test matrix verbatim.
      - 'e2e/scenarios.json'
      - '.github/workflows/deploy-doc.yml'
  workflow_dispatch:

permissions:
  contents: read
  # The latest benchmark, an artifact of ci.yml (see the step that takes it).
  actions: read

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

# The site is published from the PUBLIC mirror, softwarity/meerkat-ce, at its
# custom domain (meerkat.softwarity.dev) - the address says what it is whichever
# repository serves it.
#
# The host is Cloudflare Pages (project meerkat-site) since 2026-11-07, not
# GitHub Pages: it runs docs/functions/_middleware.js, which answers ?lg=fr
# with the French file. GitHub Pages ignored the query and answered English,
# so the French pages were seen as duplicates and never indexed. The domain's
# DNS stays where it was: a CNAME meerkat -> meerkat-site.pages.dev.
#
# It was published from the private tree for a while, so the front door would
# not be a by-product of the source dump. What moved it back is the bill: the
# private repository pays every minute, the public one none, and a doc push is
# frequent. The custom domain is what keeps it a deliberate act - "meerkat-ce"
# appears nowhere in the address.

jobs:
  # The site is built and published from the PUBLIC mirror, softwarity/meerkat-ce,
  # where minutes are free. This file lives in both trees, and on the private one
  # the job is skipped - a skipped job bills nothing. A release changes no docs/
  # file here, but it does there: mirror-ce.yml writes the latest tag into
  # docs/.release-version, which is how the pinned version reaches the site.
  deploy:
    if: github.repository == 'softwarity/meerkat-ce'
    environment:
      name: cloudflare-pages
      url: https://meerkat.softwarity.dev
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need the tags so gen-version.mjs can resolve the latest release

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install doc-site deps
        working-directory: docs
        run: npm ci

      # The Performance page reads /bench/latest.json from the site itself: the
      # newest `bench-latest` artifact ci.yml leaves, which then dispatches this
      # workflow. None yet (or expired, after 90 days without a run) builds a
      # site whose page says it has no figures, rather than failing.
      - name: Take the latest benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=bench-latest&per_page=1" \
            --jq '.artifacts[0] | select(.expired == false) | .id')
          if [ -z "$id" ]; then
            echo "::warning::no benchmark artifact: the Performance page will show none"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "$RUNNER_TEMP/bench.zip"
          mkdir -p docs/public/bench
          unzip -o -q "$RUNNER_TEMP/bench.zip" -d docs/public/bench

      - name: Build doc-site
        working-directory: docs
        # The ROOT, because the site answers on meerkat.softwarity.dev rather than
        # under a repository path. This is not cosmetic: with another base
        # baked in, every asset lands one directory beside itself and the page
        # renders black.
        run: npm run build -- --base-href "/"

      # The pages, the function that serves ?lg= (docs/functions), and the
      # host's own files the build writes (_headers, _routes.json). The project
      # is created on the first run; every later run finds it.
      - name: Deploy to Cloudflare Pages
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set on this repository (an Account API Token with Cloudflare Pages: Edit)"
            exit 1
          fi
          npx -y wrangler@4.158.0 pages project list | grep -qw meerkat-site \
            || npx -y wrangler@4.158.0 pages project create meerkat-site --production-branch main
          npx -y wrangler@4.158.0 pages deploy dist/doc-site/browser \
            --project-name meerkat-site --branch main --commit-dirty=true
