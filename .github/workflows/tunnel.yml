name: The developer tunnel, in a cluster

# The developer tunnel (DEV-11), on a real single-node Swarm: everything about
# the agent a unit test can answer already is (ee/devplug); what none can reach
# is the half that needs an orchestrator - the agent identifies itself by
# inspecting its own container - so this runs it in a cluster and serves a
# cluster name from the runner.
#
# A workflow of its own so it can run ALONE: ci-ee.yml calls it on the commit
# under test, and the Enterprise image waits for it; dispatched by hand it
# answers in minutes rather than after the whole pipeline. It runs in the
# mirror, on the PRIVATE tree, like every Enterprise job.
on:
  workflow_call:
    inputs:
      sha:
        description: Commit of softwarity/meerkat to run on.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      sha:
        description: Commit of softwarity/meerkat to run on. Empty takes main.
        type: string
        required: false

permissions:
  contents: read

jobs:
  tunnel:
    name: Serve a name from the runner
    if: github.repository == 'softwarity/meerkat-ce'
    runs-on: ubuntu-latest
    # A ceiling, because the default one is six hours and the first run of this
    # job spent them: Swarm's routing mesh accepts a connection on a published
    # port before any task answers it, so a curl with no deadline hangs rather
    # than failing, and a loop around it never advances.
    timeout-minutes: 25
    environment: enterprise
    steps:
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.EE_APP_ID }}
          private-key: ${{ secrets.EE_APP_PRIVATE_KEY }}
          owner: softwarity
          repositories: meerkat
      - uses: actions/checkout@v7
        with:
          repository: softwarity/meerkat
          ref: ${{ inputs.sha || 'main' }}
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false

      # Both images, because half of what is checked here is the difference
      # between them: one carries plug's payload, the other has nothing to hand
      # out and nothing to run.
      - name: Build the two images
        run: |
          # Not quiet: a build that fails has to say why in the log.
          docker build -f docker/Dockerfile --build-arg GO_TAGS=ee --build-arg EDITION=ee \
            -t meerkat:ee .
          docker build -f docker/Dockerfile -t meerkat:ce .

      # The payload is a COPY from plug's image at build time, which is the one
      # thing a Go test cannot see. And the version the gateway announces has
      # to be the version it hands out: when the two drifted apart, the
      # launcher asked for a version and went looking for a core that was not
      # there.
      - name: The Enterprise image carries a client, the community one does not
        run: |
          set -e
          version=$(docker run --rm --entrypoint sh meerkat:ee -c 'cat /opt/plug/VERSION')
          echo "the payload says: $version"
          test -n "$version"
          docker run --rm --entrypoint sh meerkat:ee -c 'ls /opt/plug' | grep -q . \
            || { echo "the Enterprise image carries no client"; exit 1; }
          if docker run --rm --entrypoint sh meerkat:ce -c 'ls /opt/plug 2>/dev/null' | grep -q .; then
            echo "the community image carries a payload it has nobody to serve"; exit 1
          fi
          echo "PLUG_VERSION=$version" >> "$GITHUB_ENV"

      - name: A cluster, and something to take over from
        run: |
          set -e
          docker swarm init --advertise-addr "$(hostname -I | awk '{print $1}')"
          docker network create -d overlay --attachable tunnel-net
          docker stack deploy -c .github/plug-hosted/stack.yml tunnel

      # Two things are watched, not one. A readiness probe answers when the
      # gateway is up; it says nothing when the TASK is dead, and a published
      # port answers the mesh either way - so a crash used to look exactly like
      # a slow start until the deadline ran out.
      - name: Wait for the gateway
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s --max-time 5 --connect-timeout 3 -o /dev/null \
                   -w '%{http_code}' http://localhost:19090/readyz || true)
            [ "$code" = "200" ] && { echo "ready after ${i} tries"; exit 0; }
            state=$(docker service ps tunnel_meerkat --format '{{.CurrentState}} {{.Error}}' | head -1)
            case "$state" in
              Failed*|Rejected*) echo "the gateway task did not start: $state"; break ;;
            esac
            sleep 3
          done
          echo "--- what the task says ---"
          docker service ps tunnel_meerkat --no-trunc || true
          docker service logs tunnel_meerkat --tail 120 || true
          echo "the gateway never became ready"; exit 1

      # Infra, Plug ships OFF, and the agent starts only once it is on - with
      # developer mode, which ships on. Never switched here, the agent could
      # not announce itself, whatever it was given to run.
      - name: Open the tunnel
        run: |
          set -e
          jar=$(mktemp)
          code=$(curl -s --max-time 15 -c "$jar" -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:19090/login -d "username=admin&password=tunnel-Root-Password-1")
          [ "$code" = "303" ] || { echo "signing in on the control plane answered $code"; exit 1; }
          code=$(curl -s --max-time 15 -b "$jar" -o plug.json -w '%{http_code}' \
            -X PUT http://localhost:19090/api/settings/plug -H 'Content-Type: application/json' \
            -d '{"enabled":true,"host":"localhost","port":2222}')
          [ "$code" = "200" ] || { cat plug.json; echo "opening the tunnel answered $code"; exit 1; }

      # The line that says the agent bound its port, and the version it
      # announces - compared with the payload above. Waited for: the agent
      # binds after the switch, not at the instant the page answers.
      - name: The agent is up, on the version it hands out
        run: |
          set -e
          for i in $(seq 1 20); do
            docker service logs tunnel_meerkat --tail 300 > log.txt 2>&1
            grep -q 'plug: ready' log.txt && break
            sleep 3
          done
          cat log.txt
          grep -q 'plug: ready' log.txt || { echo "the agent never announced itself"; exit 1; }
          grep -q "$PLUG_VERSION" log.txt \
            || { echo "the gateway announces a version it does not hand out"; exit 1; }

      # What a developer reaches before they have a client at all. It is piped
      # into a shell, so what it prints IS the answer.
      - name: The anonymous account hands out a client
        run: |
          set -e
          mkdir -p ~/.ssh && ssh-keyscan -p 2222 -H localhost >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p 2222 -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            get@localhost install > install.sh
          cat install.sh
          grep -qi 'does not distribute' install.sh \
            && { echo "this image answered the community notice"; exit 1; }
          sh install.sh
          # Where its own installer puts it, and where the installer TELLS you
          # to add: a fresh runner has no ~/.local/bin on PATH, so the check
          # below was looking for a client that had just installed correctly.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          test -x "$HOME/.local/bin/plug" || { echo "no client after the install"; exit 1; }
          # `version`, a subcommand - and one of the three that do not need a
          # configured cluster, so it answers on a machine that has only just
          # installed the client.
          "$HOME/.local/bin/plug" version

      # A developer, their key, and the capability that lets it open anything.
      - name: Deposit a developer's key
        run: bash .github/plug-hosted/deposit-key.sh

      # The takeover: the name leaves the cluster and answers from HERE.
      - name: Serve a cluster name from this runner
        run: bash .github/plug-hosted/serve.sh

      - name: What the cluster says when it goes wrong
        if: failure()
        run: |
          docker service logs tunnel_meerkat --tail 200 || true
          docker service ls || true
          docker service ps tunnel_checkout --no-trunc || true
