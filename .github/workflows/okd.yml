# Meerkat on a real OpenShift: MicroShift built from OKD, one node, in a
# container on the runner. e2e/platform/okd/run.sh says what is checked - the
# restricted-v2 SCC admitting the pod under a uid it chose, the Routes, and the
# developer tunnel's mount helper.
#
# ON EVERY PIPELINE, called by ci.yml (the community leg) and ci-ee.yml (the
# Enterprise one), and a gate of the image each publishes. It used to run once
# a night on its own: the night the image went distroless, `oc exec ... id`
# found no `id`, every run went red, and nothing that publishes noticed. On
# the public mirror the minutes cost nothing, and a cluster the image no
# longer starts on is exactly what must stop a publication.
#
# Runs on the community mirror, like everything else. The Enterprise leg clones
# the private tree at the commit under test with the App's token, as ci-ee.yml
# does. By hand too (both legs), for a look at main.
#
# No concurrency group of its own: two callers run it at once, and a group
# here would have each cancel the other.
name: OKD

on:
  workflow_call:
    inputs:
      edition:
        description: ce or ee
        type: string
        required: true
      ref:
        description: the private commit the Enterprise leg builds (empty is main)
        type: string
        required: false
        default: ""
  workflow_dispatch:

permissions:
  contents: read

jobs:
  community:
    name: MicroShift (community image)
    if: github.repository == 'softwarity/meerkat-ce' && (github.event_name == 'workflow_dispatch' || inputs.edition == 'ce')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The base images (golang, node, busybox) through mirror.gcr.io, Google's
      # public cache of Docker Hub, falling back to Docker Hub for what it does
      # not hold. Docker Hub counts every resolution of a base against one
      # quota shared by every job of every run, and a day of CI ran it dry: the
      # 1.8.0 image died resolving golang:1.27 (429). Pushes still go to Docker
      # Hub; a mirror only serves pulls.
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      # One architecture, loaded into the runner's Docker: the script copies it
      # from there into the cluster. Nothing is pushed.
      - name: Build the image under test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: EDITION=ce
          tags: meerkat:okd
          load: true
      - name: Meerkat on MicroShift
        run: e2e/platform/okd/run.sh meerkat:okd ce

  enterprise:
    name: MicroShift (Enterprise image)
    if: github.repository == 'softwarity/meerkat-ce' && (github.event_name == 'workflow_dispatch' || inputs.edition == 'ee')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: enterprise
    steps:
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.EE_APP_ID }}
          private-key: ${{ secrets.EE_APP_PRIVATE_KEY }}
          owner: softwarity
          repositories: meerkat
      - uses: actions/checkout@v7
        with:
          repository: softwarity/meerkat
          ref: ${{ inputs.ref }}
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      # Bases through mirror.gcr.io (see the first build of this file).
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build the image under test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            EDITION=ee
            GO_TAGS=ee
          tags: meerkat:okd
          load: true
      - name: Meerkat on MicroShift
        run: e2e/platform/okd/run.sh meerkat:okd ee
