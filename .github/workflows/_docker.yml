name: Reusable Docker build & publish

# Reusable multi-arch build (pattern shared with softwarity/plug). Each
# architecture is built on its NATIVE runner (no QEMU emulation) in parallel,
# pushed by digest; a final job assembles the manifest list. Tags are derived
# from the caller's ref by metadata-action, so the same logic serves branch
# pushes (CI) and version tags (release).
#
# Docker Hub is where the image ships: `docker pull softwarity/meerkat` is what
# a reader types without being told about a registry first. It needs two
# secrets, DOCKERHUB_USERNAME and DOCKERHUB_RW (a read/write access token,
# never the account password); without them the preflight below skips the push
# and says so, rather than turning the pipeline red over a credential.
on:
  workflow_call:
    inputs:
      image:
        description: Full image reference to publish.
        required: true
        type: string
      go-tags:
        description: Go build tags. Empty builds the community image, "ee" the Enterprise one.
        required: false
        default: ""
        type: string
      registry:
        description: docker.io or ghcr.io - decides which credential logs in.
        required: false
        default: docker.io
        type: string

env:
  IMAGE: ${{ inputs.image }}

jobs:
  preflight:
    name: Registry credentials
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - id: check
        env:
          USERNAME: ${{ inputs.registry == 'ghcr.io' && github.actor || secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ inputs.registry == 'ghcr.io' && github.token || secrets.DOCKERHUB_RW }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Image not published::the credentials for ${{ inputs.registry }} are not set, so the image is built but not pushed."
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: preflight
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      # A reusable workflow's job permissions REPLACE the caller's, so
      # declaring this on the calling job was not enough: the token reaching
      # buildx had no right to push a package.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # amd64 ONLY while the two-image split settles: an arm64 runner plus a
        # manifest list doubles the build minutes of every push, and nothing
        # being stabilised here is architecture-specific. Put linux/arm64 back
        # when the pipeline is quiet.
        platform: [linux/amd64]
    steps:
      - uses: actions/checkout@v7
      - name: Prepare platform name
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}
      - name: Docker labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/setup-buildx-action@v4
      - name: Log in to the registry
        if: needs.preflight.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry == 'ghcr.io' && 'ghcr.io' || '' }}
          username: ${{ inputs.registry == 'ghcr.io' && github.actor || secrets.DOCKERHUB_USERNAME }}
          password: ${{ inputs.registry == 'ghcr.io' && github.token || secrets.DOCKERHUB_RW }}
      - name: Resolve version
        id: ver
        # A v-tag -> its semver; any branch -> "dev". The short commit is
        # appended as build metadata so every rebuild is distinct.
        run: |
          ref="${GITHUB_REF#refs/tags/v}"
          case "$GITHUB_REF" in
            refs/tags/v*) echo "value=$ref" >> "$GITHUB_OUTPUT" ;;
            *)            echo "value=dev"  >> "$GITHUB_OUTPUT" ;;
          esac
          echo "rev=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            VERSION=${{ steps.ver.outputs.value }}
            GIT_REV=${{ steps.ver.outputs.rev }}
            BUILD_DATE=${{ steps.ver.outputs.date }}
            GO_TAGS=${{ inputs.go-tags }}
            # What the linker puts in decides the code; EDITION decides what
            # travels BESIDE it. Without this line the Enterprise image built
            # here carried no plug client at all - the agent was linked in, and
            # the account that hands the client out had nothing to hand.
            EDITION=${{ inputs.go-tags == 'ee' && 'ee' || 'ce' }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ needs.preflight.outputs.publish }}
          cache-from: type=gha,scope=${{ inputs.go-tags == 'ee' && 'ee' || 'ce' }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ inputs.go-tags == 'ee' && 'ee' || 'ce' }}-${{ env.PLATFORM_PAIR }}
      - name: Export digest
        if: needs.preflight.outputs.publish == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        if: needs.preflight.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ inputs.go-tags == 'ee' && 'ee' || 'ce' }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest list
    runs-on: ubuntu-latest
    needs: [preflight, build]
    if: needs.preflight.outputs.publish == 'true'
    permissions:
      contents: read
      # A reusable workflow's job permissions REPLACE the caller's, so
      # declaring this on the calling job was not enough: the token reaching
      # buildx had no right to push a package.
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.go-tags == 'ee' && 'ee' || 'ce' }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - name: Docker tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ inputs.registry == 'ghcr.io' && 'ghcr.io' || '' }}
          username: ${{ inputs.registry == 'ghcr.io' && github.actor || secrets.DOCKERHUB_USERNAME }}
          password: ${{ inputs.registry == 'ghcr.io' && github.token || secrets.DOCKERHUB_RW }}
      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
