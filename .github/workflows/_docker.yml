name: Reusable Docker build & publish

# Reusable multi-arch build (pattern shared with softwarity/plug). Each
# architecture is built on its NATIVE runner (no QEMU emulation) in parallel,
# pushed by digest; a final job assembles the manifest list. Tags are derived
# from the caller's ref by metadata-action.
#
# The COMMUNITY image, from the public tree: this is what ci.yml calls on the
# mirror to publish `latest`. The Enterprise image and the release tags are
# built by ci-ee.yml, in jobs of its own - the sources it builds are in
# another repository, which a called workflow cannot check out for its caller.
#
# Docker Hub is where the image ships: `docker pull softwarity/meerkat` is what
# a reader types without being told about a registry first. It needs two
# secrets, DOCKERHUB_USERNAME and DOCKERHUB_RW (a read/write access token,
# never the account password); without them the preflight below skips the push
# and says so, rather than turning the pipeline red over a credential.
on:
  workflow_call:
    inputs:
      image:
        description: Full image reference to publish.
        required: true
        type: string

env:
  IMAGE: ${{ inputs.image }}

jobs:
  preflight:
    name: Registry credentials
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - id: check
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_RW }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Image not published::the Docker Hub credentials are not set, so the image is built but not pushed."
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: preflight
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # amd64 ONLY while the two-image split settles: an arm64 runner plus a
        # manifest list doubles the build minutes of every push, and nothing
        # being stabilised here is architecture-specific. Put linux/arm64 back
        # when the pipeline is quiet - here and in ci-ee.yml together.
        platform: [linux/amd64]
    steps:
      - uses: actions/checkout@v7
      - name: Prepare platform name
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}
      - name: Docker labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        if: needs.preflight.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_RW }}
      - name: Resolve version
        id: ver
        # A v-tag -> its semver; any branch -> "dev". The short commit is
        # appended as build metadata so every rebuild is distinct.
        run: |
          ref="${GITHUB_REF#refs/tags/v}"
          case "$GITHUB_REF" in
            refs/tags/v*) echo "value=$ref" >> "$GITHUB_OUTPUT" ;;
            *)            echo "value=dev"  >> "$GITHUB_OUTPUT" ;;
          esac
          echo "rev=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # The layer cache is fine HERE: the tree it holds is the public one.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            VERSION=${{ steps.ver.outputs.value }}
            GIT_REV=${{ steps.ver.outputs.rev }}
            BUILD_DATE=${{ steps.ver.outputs.date }}
            GO_TAGS=
            EDITION=ce
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ needs.preflight.outputs.publish }}
          cache-from: type=gha,scope=ce-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=ce-${{ env.PLATFORM_PAIR }}
      - name: Export digest
        if: needs.preflight.outputs.publish == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        if: needs.preflight.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-ce-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest list
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [preflight, build]
    if: needs.preflight.outputs.publish == 'true'
    permissions:
      contents: read
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-ce-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - name: Docker tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # ONE moving tag outside a release, and it is `latest`. A branch tag
          # (`main`) named the same thing twice and nobody pulled it. The
          # semver tags of a release come from ci-ee.yml, which knows the
          # version; this tree has no tags to derive them from.
          #
          # Worth knowing before expecting this to save room: a tag is a
          # POINTER. Pushing `latest` again moves it and leaves the manifest it
          # named stored, untagged.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_RW }}
      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
