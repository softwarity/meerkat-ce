name: Migrate the images (once)

# ONE-OFF, to delete once it has run. Up to 1.22, softwarity/meerkat was the
# community edition and the evaluation went out as `eval` and `X.Y.Z-eval`. Now
# softwarity/meerkat is the image a license turns into Team or Enterprise, and
# the community edition is softwarity/meerkat-ce. This moves what was published
# before:
#
#   1. every community tag of softwarity/meerkat is copied to
#      softwarity/meerkat-ce, same digest, with its signatures (OCI referrers,
#      of the index and of each platform image);
#   2. on softwarity/meerkat, X.Y.Z takes the digest of X.Y.Z-eval, X.Y the
#      newest patch of its line, X the newest of all. A tag with no evaluation
#      build (1.0.x, 1.1.0) stays as it is.
#
# `latest` is left alone on both: the pipelines publish it. `eval` and
# `X.Y.Z-eval` stay as they are. Nothing is deleted. The first lines of the log
# are every tag and its digest before: the way back.
#
#   gh workflow run "Migrate the images (once)" -R softwarity/meerkat-ce              # the plan
#   gh workflow run "Migrate the images (once)" -R softwarity/meerkat-ce -f apply=true
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Copy and retag for real. Off, it only prints the plan.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrate:
    name: softwarity/meerkat to meerkat-ce
    if: github.repository == 'softwarity/meerkat-ce'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SRC: docker.io/softwarity/meerkat
      CE: docker.io/softwarity/meerkat-ce
    steps:
      - uses: imjasonh/setup-crane@v0.4
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_RW }}

      - name: Plan
        run: |
          set -euo pipefail
          for t in $(crane ls "$SRC" | sort -V); do
            printf '%s\t%s\n' "$t" "$(crane digest "$SRC:$t")"
          done > before.tsv
          echo "### Before" >> "$GITHUB_STEP_SUMMARY"
          { echo '```'; cat before.tsv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          digest() { awk -F'\t' -v t="$1" '$1==t{print $2}' before.tsv; }
          community=$(cut -f1 before.tsv | grep -v -- '-eval$' | grep -vx eval | grep -vx latest)
          evals=$(cut -f1 before.tsv | grep -- '-eval$' | sed 's/-eval$//' | sort -V)
          : > plan.tsv
          for t in $community; do
            printf 'copy\t%s\t%s\n' "$t" "$(digest "$t")" >> plan.tsv
          done
          for t in $community; do
            case "$t" in
              *.*.*) to="$t-eval" ;;
              *.*) p=$(echo "$evals" | grep "^${t//./\\.}\." | tail -1 || true); to=${p:+$p-eval} ;;
              *) p=$(echo "$evals" | grep "^${t}\." | tail -1 || true); to=${p:+$p-eval} ;;
            esac
            if [ -n "$to" ] && [ -n "$(digest "$to")" ]; then
              printf 'retag\t%s\t%s\t%s\n' "$t" "$to" "$(digest "$to")" >> plan.tsv
            else
              printf 'keep\t%s\t(no evaluation build)\n' "$t" >> plan.tsv
            fi
          done
          echo "### Plan" >> "$GITHUB_STEP_SUMMARY"
          { echo '```'; column -t -s $'\t' plan.tsv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          column -t -s $'\t' plan.tsv

      - name: Copy to meerkat-ce, with the signatures
        if: inputs.apply
        run: |
          set -euo pipefail
          token=$(curl -fsS "https://auth.docker.io/token?service=registry.docker.io&scope=repository:softwarity/meerkat:pull" | jq -r .token)
          referrers() {
            curl -fsS -H "Authorization: Bearer $token" -H 'Accept: application/vnd.oci.image.index.v1+json' \
              "https://registry-1.docker.io/v2/softwarity/meerkat/referrers/$1" | jq -r '.manifests[]?.digest'
          }
          declare -A copied=()
          while IFS=$'\t' read -r op tag d _; do
            [ "$op" = copy ] || continue
            if [ -z "${copied[$d]:-}" ]; then
              crane cp "$SRC@$d" "$CE@$d"
              for c in $d $(crane manifest "$SRC@$d" | jq -r '.manifests[]?.digest'); do
                for r in $(referrers "$c"); do crane cp "$SRC@$r" "$CE@$r"; done
              done
              copied[$d]=1
            fi
            crane tag "$CE@$d" "$tag"
            echo "copied   meerkat:$tag -> meerkat-ce:$tag ($d)"
          done < plan.tsv

      - name: Retag meerkat on the evaluation builds
        if: inputs.apply
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r op tag from d; do
            [ "$op" = retag ] || continue
            crane tag "$SRC@$d" "$tag"
            echo "retagged meerkat:$tag = meerkat:$from ($d)"
          done < plan.tsv

      # Every tag now names what the plan said, and a version from 1.7.0 on
      # verifies against the identity the install page gives (up to 1.6.0
      # nothing was signed).
      - name: Check
        if: inputs.apply
        run: |
          set -euo pipefail
          id='^https://github\.com/softwarity/meerkat-ce/\.github/workflows/(ci-ee|_docker)\.yml@refs/heads/main$'
          signed() {
            cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "$id" "$1" >/dev/null 2>&1
          }
          old() { printf '%s\n1.7.0\n' "$1" | sort -V | head -1 | grep -qvx 1.7.0; }
          bad=0
          while IFS=$'\t' read -r op tag a b; do
            case "$op" in
              copy) ref="$CE:$tag" want=$a ;;
              retag) ref="$SRC:$tag" want=$b ;;
              *) continue ;;
            esac
            got=$(crane digest "$ref")
            if [ "$got" != "$want" ]; then echo "::error::$ref is $got, the plan said $want"; bad=1; continue; fi
            case "$tag" in *.*.*) ;; *) echo "ok       $ref"; continue ;; esac
            if old "$tag"; then echo "ok       $ref (unsigned, as every version up to 1.6.0)"
            elif signed "$ref"; then echo "signed   $ref"
            else echo "::error::$ref does not verify"; bad=1
            fi
          done < plan.tsv
          exit $bad
