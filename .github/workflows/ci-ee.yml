name: CI - Enterprise

# The Enterprise pipeline, run on the PUBLIC mirror against the PRIVATE sources.
#
# GitHub bills every minute a private repository runs and none a public one
# runs, and the Enterprise tree used to be tested and built on the private
# side for one reason: it was the only tree that had ee/. This workflow turns
# that around. It lives in both trees and runs in ONE - the mirror,
# softwarity/meerkat-ce - where it clones the private repository at the commit
# it is told about, and runs on it what the community pipeline (ci.yml) cannot:
# everything built with the ee tag, the suite on PostgreSQL, the two
# directories only the Enterprise driver talks to, the integration suite
# driving the multi-organisation product, and the Enterprise image.
#
# WHAT A PUBLIC RUNNER MAKES PUBLIC, and what this file does about each:
#
#   the logs      readable by anyone. A failing build prints the line that
#                 failed, a failing test its diff. Extracts, not the product:
#                 accepted. No -v except where a count needs it.
#   artifacts     downloadable by anyone, with no account. None is uploaded
#                 here: not the console, not a Playwright report, not a digest.
#   the cache     restorable by a pull request from a fork. The Go build cache
#                 holds the compiled archives, the Docker layer cache the COPY
#                 of the sources. Every cache of the tree is off in every job
#                 below; what stays cached is public packages and a browser.
#   the secret    the one that opens the private repository. It is a GitHub
#                 App's private key, kept on the `enterprise` ENVIRONMENT:
#                 visible to a job that names the environment, invisible to
#                 every other workflow of this repository. The token minted
#                 from it lives one hour, reads one repository, is revoked
#                 when the job ends, and the checkout does not keep it in
#                 .git/config for the steps that follow.
#
# WHO CAN START IT. A push to the private main: mirror-ce.yml publishes the
# community tree, then sends a repository_dispatch here naming the commit. A
# hand: workflow_dispatch, with or without a commit. Never a pull request - a
# fork's pull request receives no secret, and pull_request_target, which
# would, is not listed. A fork of the mirror inherits this file and none of
# the secrets, so the first job asks the repository's name and the whole
# pipeline stands down anywhere else.
#
# EVERYTHING RUNS ON EVERY COMMIT. The directories and the whole tree on
# PostgreSQL used to wait for their own code to move, or for a weekly run,
# because they cost minutes the private repository paid for. Here they cost
# nothing, and a check that waits answers late: on the push after the one
# that broke it.
#
# A RELEASE IS AN APPROVAL. Every run on main ends on a job that waits on the
# `release` environment, where a reviewer is required. Approving it releases
# the build that just went green: the Enterprise image this very run pushed is
# re-tagged BY DIGEST under its semver - nothing is rebuilt, what ships is what
# was tested - the community image follows, and release-flow cuts the version
# on the private repository (notes, commit, tag, GitHub Release). The bump
# rides in the approval's comment: empty is a patch, `minor` or `major` say
# so. Not approving costs nothing: the next push cancels the waiting run, so
# only the latest green build can ever be released.
#
# Two commits are never offered for release, and their run ends on a SKIPPED
# gate rather than a waiting one: a commit whose message says `[skip release]`,
# and the release's own commit (its subject is the bare version, as
# release-flow writes it - mirror-ce.yml does not even dispatch that one).
on:
  repository_dispatch:
    types: [enterprise]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit of softwarity/meerkat to run on. Empty takes main.
        required: false
        default: ""

permissions:
  contents: read

# One pipeline, cancelled by the next push - a run waiting for its release
# approval included, which is what keeps an old build from being released
# over a newer one.
concurrency:
  group: ci-ee
  cancel-in-progress: true

jobs:
  # Which commit, and what it changes. ONE job resolves it so that every other
  # one runs on the same commit: main moves while a pipeline runs, and a
  # pipeline whose jobs each took "main" would test six different trees.
  source:
    name: Which commit
    if: github.repository == 'softwarity/meerkat-ce'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: enterprise
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      # Whether the release gate is offered at the end, or skipped.
      releasable: ${{ steps.resolve.outputs.releasable }}
    steps:
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.EE_APP_ID }}
          private-key: ${{ secrets.EE_APP_PRIVATE_KEY }}
          owner: softwarity
          repositories: meerkat
      - id: resolve
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ASKED: ${{ github.event.client_payload.sha || inputs.sha }}
        run: |
          set -e
          # The API rather than a clone: this job has nothing to build, it
          # needs the commit's full id and its message, whatever it was asked by.
          commit=$(gh api "repos/softwarity/meerkat/commits/${ASKED:-main}")
          sha=$(jq -r .sha <<<"$commit")
          message=$(jq -r .commit.message <<<"$commit")
          subject=${message%%$'\n'*}
          releasable=true
          if [[ "$subject" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            releasable=false; why="this is the release's own commit"
          elif [[ "$message" == *"[skip release]"* ]]; then
            releasable=false; why="the commit asks not to be released"
          fi
          {
            echo "sha=$sha"
            echo "releasable=$releasable"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Enterprise sources: softwarity/meerkat@${sha::7} - $subject"
            if [ "$releasable" = false ]; then echo "No release gate: $why."; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Every job below opens with the same three steps: a token, the private
  # tree at the resolved commit, Go without its cache. The token is minted
  # per job because a job's output cannot carry a secret - GitHub blanks it.
  lint:
    name: Lint
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: enterprise
    steps:
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.EE_APP_ID }}
          private-key: ${{ secrets.EE_APP_PRIVATE_KEY }}
          owner: softwarity
          repositories: meerkat
      - uses: actions/checkout@v7
        with:
          repository: softwarity/meerkat
          ref: ${{ needs.source.outputs.sha }}
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      # The whole tree under the tag. The mirror lints the same files without
      # it, but the tag switches files on inside internal/ too, and a file
      # nobody lints is a file that drifts.
      - uses: golangci/golangci-lint-action@v9
        with:
          args: --build-tags ee ./...
          # Its cache is the Go build cache under another name.
          skip-cache: true

  # The Go side in ONE job: vet, the tests, and the two static builds, each
  # paying one checkout and one compilation of the graph.
  #
  # -race on ./ee/... only: ./internal runs under the detector on the mirror,
  # on the very same files, and the concurrency in those packages is the same
  # code on both sides. Here ./internal runs once WITH the tag and without
  # -race, for the files the tag switches on.
  unit:
    name: Go - vet, tests, builds
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: enterprise
    steps:
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.EE_APP_ID }}
          private-key: ${{ secrets.EE_APP_PRIVATE_KEY }}
          owner: softwarity
          repositories: meerkat
      - uses: actions/checkout@v7
        with:
          repository: softwarity/meerkat
          ref: ${{ needs.source.outputs.sha }}
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Vet
        run: go vet -tags ee ./...
      - name: Test
        run: |
          go test -tags ee ./internal/... ./cmd/...
          go test -race -tags ee ./ee/...
      # Static, no CGO, amd64 and arm64. Linux only, and that is the whole
      # target - Meerkat ships as an image.
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          for goarch in amd64 arm64; do
            echo "building linux/$goarch -tags ee"
            GOARCH=$goarch go build -trimpath -tags ee -ldflags '-s -w' -o /dev/null ./cmd/meerkat
          done

  # The SAME suite, on the other database (QUAL-01).
  #
  # PostgreSQL is what a cluster runs on (STORE-03), and until this job existed
  # the evidence that the product works on it was ONE smoke test. The first
  # run of this job found two queries broken, one silently waiting for 2038.
  #
  # No second suite was written: internal/store/dbtest gives every test a
  # private schema when MEERKAT_TEST_DATABASE_URL names a server, and returns
  # nothing when it does not, so `go test ./...` on a laptop is untouched.
  #
  # Enterprise only: connecting to an external database is one of the two
  # images' differences, so it is the only tree that can be pointed at a
  # server. The community binary answers a database URL in words.
  postgres:
    name: The suite on PostgreSQL
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: enterprise
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: meerkat
          POSTGRES_PASSWORD: meerkat
          POSTGRES_DB: meerkat
        ports:
          - 5432:5432
        # Without this the first connection races the server's own startup,
        # and the failure reads as a broken query rather than a missing server.
        options: >-
          --health-cmd "pg_isready -U meerkat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MEERKAT_TEST_DATABASE_URL: postgres://meerkat:meerkat@localhost:5432/meerkat?sslmode=disable
    steps:
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.EE_APP_ID }}
          private-key: ${{ secrets.EE_APP_PRIVATE_KEY }}
          owner: softwarity
          repositories: meerkat
      - uses: actions/checkout@v7
        with:
          repository: softwarity/meerkat
          ref: ${{ needs.source.outputs.sha }}
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      # A suite that quietly fell back to the embedded database would be green
      # about nothing, which is the failure this whole job exists to prevent.
      # The smoke test SKIPS when the variable is unset, and a skip passes - so
      # it is run alone, verbosely, and counted.
      - name: Prove the server is actually reached
        run: |
          go test -tags ee ./internal/store/ -run TestAgainstARealPostgres -count=1 -v 2>&1 | tee out.txt
          grep -q -- '--- PASS: TestAgainstARealPostgres' out.txt \
            || { echo "the suite did not reach PostgreSQL"; exit 1; }
      # What a real server changes and a single process cannot answer: two
      # gateways against one database, agreeing. Cheap, and on every commit.
      - name: The cluster, against a real server
        run: go test -tags ee ./ee/changebus/ ./internal/cluster/ ./internal/store/ -count=1
      # The WHOLE tree on PostgreSQL - the promise that the same suite runs
      # twice, once on each storage. No -race here: the point is the dialect,
      # and the unit job already runs ee/ under the detector.
      - name: The suite, on the other storage
        run: go test -tags ee ./... -count=1

  # The authorities, against the real thing. test/ldap brings up OpenLDAP, an
  # Active Directory and Dex; without them these tests SKIP, and a skip is
  # silent - `ok internal/idp` was being reported for five tests that never
  # ran.
  #
  # One job per directory rather than one for all three: "the directories
  # failed" sends someone reading logs, while "Active Directory failed" names
  # the thing. It also stops the slowest server from gating the others.
  #
  # Dex exercises the OIDC driver, community code the mirror's own pipeline
  # already runs against Dex; it runs here too, deliberately, because the
  # Enterprise binary is a different binary and the LDAP rows need the tag.
  directories:
    name: ${{ matrix.directory }}
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: enterprise
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: OpenLDAP
            service: openldap
            tests: 'TestLDAPDirectorySignIn|TestLDAPRefusesBadCredentials|TestLDAPNestedGroupsCanBeTurnedOff'
            expect: 3
          - directory: Active Directory
            service: samba
            tests: 'TestLDAPActiveDirectorySignIn'
            expect: 1
          - directory: OIDC (Dex)
            service: dex
            tests: 'TestOIDCAgainstDex'
            expect: 1
    steps:
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.EE_APP_ID }}
          private-key: ${{ secrets.EE_APP_PRIVATE_KEY }}
          owner: softwarity
          repositories: meerkat
      - uses: actions/checkout@v7
        with:
          repository: softwarity/meerkat
          ref: ${{ needs.source.outputs.sha }}
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Start ${{ matrix.directory }}
        working-directory: test/ldap
        run: docker compose up -d ${{ matrix.service }}
      # The domain controller provisions itself before it answers, and it is
      # the only one that needs seeding afterwards.
      - name: Wait for the domain controller
        if: matrix.service == 'samba'
        run: |
          for _ in $(seq 1 60); do
            [ "$(docker inspect meerkat-samba-ad --format '{{.State.Health.Status}}' 2>/dev/null)" = healthy ] && break
            sleep 5
          done
          docker exec meerkat-samba-ad sh /seed.sh
      # A skipped test PASSES, so counting is the only thing that tells "they
      # ran" from "nothing answered and nobody noticed". The one place -v is
      # needed: the count reads it.
      - name: Run against it, and prove they ran
        env:
          EXPECT: ${{ matrix.expect }}
        run: |
          go test -tags ee ./ee/directories/ ./internal/idp/ -run '${{ matrix.tests }}' -count=1 -v 2>&1 | tee out.txt
          ran=$(grep -c -- '--- PASS' out.txt)
          echo "$ran of $EXPECT expected tests ran against ${{ matrix.directory }}"
          [ "$ran" -eq "$EXPECT" ] || { echo "the server was not reached"; exit 1; }
      - if: always()
        working-directory: test/ldap
        run: docker compose down -v

  # Integration: a real gateway + the built console, driven by Playwright over
  # the seeded profiles of e2e/scenarios.json (positive AND negative access).
  # The suite asks the tree what it can build: with ee/ it drives the
  # Enterprise product multi-organisation, and the scenarios marked
  # `edition: "ee"` in scenarios.json run only here.
  e2e:
    name: Integration (Playwright)
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: enterprise
    steps:
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.EE_APP_ID }}
          private-key: ${{ secrets.EE_APP_PRIVATE_KEY }}
          owner: softwarity
          repositories: meerkat
      - uses: actions/checkout@v7
        with:
          repository: softwarity/meerkat
          ref: ${{ needs.source.outputs.sha }}
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          # npm's cache holds public packages and nothing of this tree.
          cache: npm
          cache-dependency-path: |
            console/package-lock.json
            e2e/package-lock.json
      # The console, built HERE rather than taken from the community pipeline:
      # an artifact on this repository is public, and fetching one across
      # workflows needs a token and a run id, for files that take two minutes
      # to make. Production, not development: it is what ships.
      - name: Build the console
        working-directory: console
        run: |
          npm ci
          npm run build
      # The browser is 130 MB downloaded on every single run, and it changes
      # only when Playwright does - which the lock file says exactly. It is a
      # browser: nothing of the tree is in it.
      - name: Cache the browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # Playwright transpiles the specs without checking them, so a suite can
      # be green with a tsconfig that no longer compiles.
      - name: Type-check the specs
        working-directory: e2e
        run: npx tsc --noEmit
      # No report uploaded, on purpose: it would be a public download. A
      # failure here is read in the log, or reproduced on a laptop.
      - name: Run integration suite
        working-directory: e2e
        run: npx playwright test

  # The developer tunnel, in a cluster (DEV-11). Everything about the agent a
  # unit test can answer already is (ee/devplug); what none can reach is the
  # half that needs an orchestrator - the agent identifies itself by inspecting
  # its own container - so this runs it on a real single-node Swarm and serves
  # a cluster name from the runner. It used to be a weekly workflow of its own,
  # to save minutes; the minutes here are public, and a check that runs once a
  # week is a check nobody sees fail - it never passed once in that form.
  tunnel:
    name: The developer tunnel, in a cluster
    needs: source
    runs-on: ubuntu-latest
    # A ceiling, because the default one is six hours and the first run of this
    # job spent them: Swarm's routing mesh accepts a connection on a published
    # port before any task answers it, so a curl with no deadline hangs rather
    # than failing, and a loop around it never advances.
    timeout-minutes: 25
    environment: enterprise
    steps:
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.EE_APP_ID }}
          private-key: ${{ secrets.EE_APP_PRIVATE_KEY }}
          owner: softwarity
          repositories: meerkat
      - uses: actions/checkout@v7
        with:
          repository: softwarity/meerkat
          ref: ${{ needs.source.outputs.sha }}
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false

      # Both images, because half of what is checked here is the difference
      # between them: one carries plug's payload, the other has nothing to hand
      # out and nothing to run.
      - name: Build the two images
        run: |
          # Not quiet: a build that fails has to say why in the log.
          docker build -f docker/Dockerfile --build-arg GO_TAGS=ee --build-arg EDITION=ee \
            -t meerkat:ee .
          docker build -f docker/Dockerfile -t meerkat:ce .

      # The payload is a COPY from plug's image at build time, which is the one
      # thing a Go test cannot see. And the version the gateway announces has
      # to be the version it hands out: when the two drifted apart, the
      # launcher asked for a version and went looking for a core that was not
      # there.
      - name: The Enterprise image carries a client, the community one does not
        run: |
          set -e
          version=$(docker run --rm --entrypoint sh meerkat:ee -c 'cat /opt/plug/VERSION')
          echo "the payload says: $version"
          test -n "$version"
          docker run --rm --entrypoint sh meerkat:ee -c 'ls /opt/plug' | grep -q . \
            || { echo "the Enterprise image carries no client"; exit 1; }
          if docker run --rm --entrypoint sh meerkat:ce -c 'ls /opt/plug 2>/dev/null' | grep -q .; then
            echo "the community image carries a payload it has nobody to serve"; exit 1
          fi
          echo "PLUG_VERSION=$version" >> "$GITHUB_ENV"

      - name: A cluster, and something to take over from
        run: |
          set -e
          docker swarm init --advertise-addr "$(hostname -I | awk '{print $1}')"
          docker network create -d overlay --attachable tunnel-net
          docker stack deploy -c .github/plug-hosted/stack.yml tunnel

      # Two things are watched, not one. A readiness probe answers when the
      # gateway is up; it says nothing when the TASK is dead, and a published
      # port answers the mesh either way - so a crash used to look exactly like
      # a slow start until the deadline ran out.
      - name: Wait for the gateway
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s --max-time 5 --connect-timeout 3 -o /dev/null \
                   -w '%{http_code}' http://localhost:19090/readyz || true)
            [ "$code" = "200" ] && { echo "ready after ${i} tries"; exit 0; }
            state=$(docker service ps tunnel_meerkat --format '{{.CurrentState}} {{.Error}}' | head -1)
            case "$state" in
              Failed*|Rejected*) echo "the gateway task did not start: $state"; break ;;
            esac
            sleep 3
          done
          echo "--- what the task says ---"
          docker service ps tunnel_meerkat --no-trunc || true
          docker service logs tunnel_meerkat --tail 120 || true
          echo "the gateway never became ready"; exit 1

      # Infra, Plug ships OFF, and the agent starts only once it is on - with
      # developer mode, which ships on. Never switched here, the agent could
      # not announce itself, whatever it was given to run.
      - name: Open the tunnel
        run: |
          set -e
          jar=$(mktemp)
          code=$(curl -s --max-time 15 -c "$jar" -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:19090/login -d "username=admin&password=tunnel-Root-Password-1")
          [ "$code" = "303" ] || { echo "signing in on the control plane answered $code"; exit 1; }
          code=$(curl -s --max-time 15 -b "$jar" -o plug.json -w '%{http_code}' \
            -X PUT http://localhost:19090/api/settings/plug -H 'Content-Type: application/json' \
            -d '{"enabled":true,"host":"localhost","port":2222}')
          [ "$code" = "200" ] || { cat plug.json; echo "opening the tunnel answered $code"; exit 1; }

      # The line that says the agent bound its port, and the version it
      # announces - compared with the payload above. Waited for: the agent
      # binds after the switch, not at the instant the page answers.
      - name: The agent is up, on the version it hands out
        run: |
          set -e
          for i in $(seq 1 20); do
            docker service logs tunnel_meerkat --tail 300 > log.txt 2>&1
            grep -q 'plug: ready' log.txt && break
            sleep 3
          done
          cat log.txt
          grep -q 'plug: ready' log.txt || { echo "the agent never announced itself"; exit 1; }
          grep -q "$PLUG_VERSION" log.txt \
            || { echo "the gateway announces a version it does not hand out"; exit 1; }

      # What a developer reaches before they have a client at all. It is piped
      # into a shell, so what it prints IS the answer.
      - name: The anonymous account hands out a client
        run: |
          set -e
          mkdir -p ~/.ssh && ssh-keyscan -p 2222 -H localhost >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p 2222 -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
            get@localhost install > install.sh
          cat install.sh
          grep -qi 'does not distribute' install.sh \
            && { echo "this image answered the community notice"; exit 1; }
          sh install.sh
          # Where its own installer puts it, and where the installer TELLS you
          # to add: a fresh runner has no ~/.local/bin on PATH, so the check
          # below was looking for a client that had just installed correctly.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          test -x "$HOME/.local/bin/plug" || { echo "no client after the install"; exit 1; }
          # `version`, a subcommand - and one of the three that do not need a
          # configured cluster, so it answers on a machine that has only just
          # installed the client.
          "$HOME/.local/bin/plug" version

      # A developer, their key, and the capability that lets it open anything.
      - name: Deposit a developer's key
        run: bash .github/plug-hosted/deposit-key.sh

      # The takeover: the name leaves the cluster and answers from HERE.
      - name: Serve a cluster name from this runner
        run: bash .github/plug-hosted/serve.sh

      - name: What the cluster says when it goes wrong
        if: failure()
        run: |
          docker service logs tunnel_meerkat --tail 200 || true
          docker service ls || true
          docker service ps tunnel_checkout --no-trunc || true

  # The Enterprise image, once everything is green. It is the artifact that IS
  # the licence: what separates it from the community one is the code the
  # linker put in it, not a flag it reads.
  #
  # Written out rather than calling _docker.yml: a reusable workflow checks
  # out the repository that CALLS it, and the sources are in another one; and
  # its jobs would need the environment, which a called workflow cannot be
  # handed reliably. Both architectures, from one build (see the Dockerfile).
  #
  # Every run publishes `latest`; the semver tags are added to this very image,
  # by digest, by the release job below once it is approved. A tag is a
  # pointer: what removes the manifests it stops naming is the weekly prune on
  # the private side (prune-packages.yml), not the push.
  #
  # THE GATE: everything it needs has PASSED.
  image:
    name: Build & publish the Enterprise image
    needs: [source, lint, unit, postgres, directories, e2e, tunnel]
    if: >-
      !cancelled()
      && needs.lint.result == 'success' && needs.unit.result == 'success'
      && needs.postgres.result == 'success' && needs.directories.result == 'success'
      && needs.e2e.result == 'success' && needs.tunnel.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: enterprise
    # id-token: write is the whole cost of signing keyless - it lets the runner
    # ask GitHub for the OIDC token cosign trades for a short-lived signing
    # certificate. There is no key to keep anywhere. A job-level block REPLACES
    # the workflow's, so contents: read is repeated rather than inherited.
    permissions:
      contents: read
      id-token: write
    outputs:
      # What was pushed, exactly: the release re-tags this and nothing else.
      digest: ${{ steps.build.outputs.digest }}
      # Same, for the evaluation image (EVAL-01).
      eval-digest: ${{ steps.build-eval.outputs.digest }}
    steps:
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.EE_APP_ID }}
          private-key: ${{ secrets.EE_APP_PRIVATE_KEY }}
          owner: softwarity
          repositories: meerkat
      - uses: actions/checkout@v7
        with:
          repository: softwarity/meerkat
          ref: ${{ needs.source.outputs.sha }}
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      # Both architectures from ONE build: the Dockerfile compiles on the
      # runner's platform and only its last stage is per target, so QEMU runs
      # two shell lines, not a compiler.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # A classic token with write:packages. This repository's own GITHUB_TOKEN
      # cannot push to a package that belongs to another repository, and GH
      # Packages does not document accepting an App's token.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_WRITE_PACKAGE }}
      - id: meta
        env:
          SHA: ${{ needs.source.outputs.sha }}
        run: |
          {
            echo "rev=${SHA::7}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      # No layer cache: on a public repository it is readable from a fork's
      # pull request, and the build stage COPYs the sources into a layer.
      #
      # The labels name the PRIVATE repository, by hand: derived from this
      # run they would name the mirror, and the source label is also what GH
      # Packages reads to connect a package to a repository.
      #
      # VERSION is `dev`: the version is not known when the image is built,
      # it is chosen when the image is approved, and this image is never
      # rebuilt. The commit is what identifies it.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/softwarity/meerkat:latest
          labels: |
            org.opencontainers.image.source=https://github.com/softwarity/meerkat
            org.opencontainers.image.revision=${{ needs.source.outputs.sha }}
          build-args: |
            VERSION=dev
            GIT_REV=${{ steps.meta.outputs.rev }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
            GO_TAGS=ee
            EDITION=ee
      - run: echo "published ghcr.io/softwarity/meerkat:latest @ ${{ steps.build.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@v4.1.2
      # Signed BY DIGEST, which is why this belongs here and not in the release
      # job: the release re-tags this very digest under its semver without
      # rebuilding, so the signature made now is still the signature of what
      # ships. A signature attached to a tag would have had to be redone, and
      # would have drifted the day somebody moved the tag.
      #
      # --recursive signs the two per-architecture manifests the index points
      # at, not only the index. Without it a client that pulled the amd64 image
      # verifies the thing it is NOT running, finds no signature for the thing
      # it is, and the policy fails on a correct image.
      #
      # The registry credentials are the ones docker/login-action put in place
      # above: cosign pushes the signature as an OCI artifact beside the image,
      # in the same package, and needs nothing of its own.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --recursive "ghcr.io/softwarity/meerkat@${DIGEST}"

      # THE EVALUATION IMAGE (EVAL-01). The Enterprise build plus ee/eval, and
      # nothing else: every feature, no time limit, no counter, no switch that
      # stops the data plane. What it adds is a notice on each surface someone
      # reads, which is what makes it unusable in front of a production
      # without taking anything away from an evaluation.
      #
      # On DOCKER HUB, beside the community image, and not on GH Packages
      # where the Enterprise one lives: an image nobody outside the org can
      # pull is an image nobody can evaluate. Publishing it in the open is
      # safe because the mirror strips ee/ from the public tree (mirror-ce),
      # so the sources that would rebuild it without its marks are not out
      # there.
      #
      # `eval` is to this image what `latest` is to the other two. The release
      # job adds X.Y.Z-eval, and only the full version: `1.2-eval` and
      # `1-eval` would be floating tags on a build whose whole point is to be
      # identifiable.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_RW }}
      - id: build-eval
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: docker.io/softwarity/meerkat:eval
          labels: |
            org.opencontainers.image.source=https://github.com/softwarity/meerkat
            org.opencontainers.image.revision=${{ needs.source.outputs.sha }}
          build-args: |
            VERSION=dev
            GIT_REV=${{ steps.meta.outputs.rev }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
            GO_TAGS=ee eval
            EDITION=ee
      - run: echo "published docker.io/softwarity/meerkat:eval @ ${{ steps.build-eval.outputs.digest }}" | tee -a "$GITHUB_STEP_SUMMARY"
      # Signed by digest like the other two (DEPLOY-08): an evaluation image is
      # the one most likely to be pulled by somebody who has never met us, and
      # the signature is what says it came from this workflow rather than from
      # whoever re-published it with the notices taken out.
      - name: Sign the evaluation image
        env:
          DIGEST: ${{ steps.build-eval.outputs.digest }}
        run: cosign sign --yes --recursive "docker.io/softwarity/meerkat@${DIGEST}"

  # THE RELEASE. This job waits on the `release` environment - a reviewer is
  # required there - and does nothing until somebody approves it. Approving
  # releases THIS build: the image this run pushed, the commit this run tested.
  # Nothing is rebuilt.
  #
  # The bump rides in the approval's comment: empty is a patch, `minor` or
  # `major` say so, anything else stops the job before it touches a thing.
  #
  # ORDER MATTERS. The commit release-flow pushes to the private main starts
  # the mirror, which dispatches the next run, which CANCELS this one (the
  # concurrency above). So everything that must finish is done BEFORE that
  # push: the version is computed from the tags, both images are stamped and
  # tagged, and release-flow runs last - its push is the last thing this job
  # does, on purpose.
  #
  # STAMPED, NOT REBUILT. The version is not known when an image is built, so
  # the binary inside says `dev`. A release puts a one-line layer on top of the
  # tested image - FROM its digest, ENV MEERKAT_VERSION - which the binary
  # reads at start (internal/version). Same layers, same bytes; the manifest
  # alone is new, and what separates `latest` from `1.2.3` is a label and an
  # environment variable.
  #
  # The community image is the mirror's (ci.yml, Docker Hub, from the public
  # tree). Its `latest` is stamped the same way when its revision label names
  # the mirror commit of this very source commit; when the mirror's pipeline
  # has not finished yet, or `latest` has moved on, it is built here instead,
  # from the private tree without the ee tag - the same bytes, four minutes.
  release:
    name: Release (approve to publish)
    needs: [source, image]
    if: ${{ !cancelled() && needs.image.result == 'success' && needs.source.outputs.releasable == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      # The approvals of this very run, where the bump is written.
      actions: read
    steps:
      - name: Read the approval
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          approval=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/approvals" \
            --jq '[.[] | select(.state == "approved") | select(any(.environments[]; .name == "release"))] | last')
          # No approval means the environment did not ask for one - GitHub
          # creates an environment the moment a job names it, unprotected.
          # A release job that nobody approved would release every push.
          if [ -z "$approval" ] || [ "$approval" = "null" ]; then
            echo "::error::nobody approved this release: the 'release' environment must require a reviewer (Settings > Environments > release)"
            exit 1
          fi
          comment=$(jq -r '.comment // ""' <<<"$approval")
          bump=$(printf '%s' "$comment" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          case "$bump" in
            "") bump="patch" ;;
            patch|minor|major) ;;
            *) echo "::error::the approval comment must be empty (patch), minor or major - got '$comment'"; exit 1 ;;
          esac
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "approved as a $bump release"

      # The App that WRITES the private repository. Its key lives on this
      # environment alone, behind the reviewer: the one that the test jobs
      # hold (environment: enterprise) can only read.
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: softwarity
          repositories: meerkat
      # main, with its tags, and WITH the credential kept: release-flow
      # commits, tags and pushes through this checkout's origin.
      - uses: actions/checkout@v7
        with:
          repository: softwarity/meerkat
          ref: main
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
      # And main must still BE the tested commit: a push that skipped the
      # mirror ([skip ci]) would otherwise be released under this build's green.
      - name: main is still the tested commit
        env:
          SHA: ${{ needs.source.outputs.sha }}
        run: |
          head=$(git rev-parse HEAD)
          [ "$head" = "$SHA" ] || { echo "::error::main is at ${head::7} but this build tested ${SHA::7}: a push moved main without a pipeline - run the pipeline again, then approve that one"; exit 1; }
      # The same arithmetic release-flow does, from the same tags; the job
      # checks that the two agreed once release-flow has run.
      - name: Next version
        id: next
        env:
          BUMP: ${{ steps.bump.outputs.bump }}
        run: |
          set -e
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          last=${last:-0.0.0}
          maj=${last%%.*}; rest=${last#*.}; min=${rest%%.*}; pat=${rest#*.}
          case "$BUMP" in
            major) maj=$((maj + 1)); min=0; pat=0 ;;
            minor) min=$((min + 1)); pat=0 ;;
            patch) pat=$((pat + 1)) ;;
          esac
          {
            echo "version=$maj.$min.$pat"
            echo "minor=$maj.$min"
            echo "major=$maj"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "$last -> $maj.$min.$pat ($BUMP)"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GH Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_WRITE_PACKAGE }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_RW }}

      # The Enterprise image: the digest the image job pushed, nothing else.
      # The digest names an index, and the stamp is built for each platform in
      # it from that platform's own image.
      - name: Stamp and tag the Enterprise image
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/Dockerfile.stamp
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE=ghcr.io/softwarity/meerkat@${{ needs.image.outputs.digest }}
            VERSION=${{ steps.next.outputs.version }}
          tags: |
            ghcr.io/softwarity/meerkat:${{ steps.next.outputs.version }}
            ghcr.io/softwarity/meerkat:${{ steps.next.outputs.minor }}
            ghcr.io/softwarity/meerkat:${{ steps.next.outputs.major }}

      # The evaluation image: the digest the image job pushed, stamped with the
      # version the same way, and tagged X.Y.Z-eval. The floating `eval` tag
      # already points at this digest - it was pushed as `eval` - so there is
      # nothing to move here.
      - name: Stamp and tag the evaluation image
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/Dockerfile.stamp
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE=docker.io/softwarity/meerkat@${{ needs.image.outputs.eval-digest }}
            VERSION=${{ steps.next.outputs.version }}
          tags: docker.io/softwarity/meerkat:${{ steps.next.outputs.version }}-eval

      # The community image: is Docker Hub's `latest` the mirror's build of
      # this very commit? The mirror commit names the private one in its
      # message, and the image names the mirror commit in its revision label.
      - uses: actions/checkout@v7
        with:
          path: mirror
          fetch-depth: 0
      - name: Is the community latest this commit?
        id: community
        env:
          SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -e
          mirrored=$(git -C mirror log --format=%H -n1 --grep="meerkat@${SHA::7}" origin/main || true)
          built=$(docker buildx imagetools inspect docker.io/softwarity/meerkat:latest \
            --format '{{index .Image.Config.Labels "org.opencontainers.image.revision"}}' 2>/dev/null || true)
          if [ -n "$mirrored" ] && [ "$mirrored" = "$built" ]; then
            digest=$(docker buildx imagetools inspect docker.io/softwarity/meerkat:latest --format '{{.Manifest.Digest}}')
            echo "stamp=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "Docker Hub's latest is the mirror's ${mirrored::7}, built from this commit: stamped, not rebuilt"
          else
            echo "stamp=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub's latest is built from '${built:-?}' and this commit mirrors as '${mirrored:-nothing yet}': building the community image here"
          fi
      - name: Stamp and tag the community image
        if: steps.community.outputs.stamp == 'true'
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/Dockerfile.stamp
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE=docker.io/softwarity/meerkat@${{ steps.community.outputs.digest }}
            VERSION=${{ steps.next.outputs.version }}
          tags: |
            docker.io/softwarity/meerkat:${{ steps.next.outputs.version }}
            docker.io/softwarity/meerkat:${{ steps.next.outputs.minor }}
            docker.io/softwarity/meerkat:${{ steps.next.outputs.major }}
      # The fallback: the same bytes the mirror would build, with the version
      # linked in since it is known here. No layer cache, for the reason the
      # image job gives: the build stage holds the whole private tree.
      - name: Build and tag the community image
        if: steps.community.outputs.stamp != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            docker.io/softwarity/meerkat:${{ steps.next.outputs.version }}
            docker.io/softwarity/meerkat:${{ steps.next.outputs.minor }}
            docker.io/softwarity/meerkat:${{ steps.next.outputs.major }}
          labels: |
            org.opencontainers.image.source=https://github.com/softwarity/meerkat-ce
            org.opencontainers.image.revision=${{ needs.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.next.outputs.version }}
          build-args: |
            VERSION=${{ steps.next.outputs.version }}
            GIT_REV=${{ needs.source.outputs.sha }}
            BUILD_DATE=${{ steps.next.outputs.date }}
            GO_TAGS=
            EDITION=ce

      # Last, because its push starts the next run: the notes, the commit, the
      # tag and the GitHub Release, on the private repository. gh resolves the
      # repository from the checkout's origin; GH_REPO says it out loud.
      - name: Cut the version on the private repository
        id: flow
        uses: softwarity/release-flow@v1
        with:
          bump: ${{ steps.bump.outputs.bump }}
          token: ${{ steps.token.outputs.token }}
          # The chart's version and appVersion follow the release: what canopy
          # deploys says which Meerkat it is.
          helm-chart: deploy/helm/meerkat
          commit-user-name: softwarity-bot
          commit-user-email: bot@softwarity.io
        env:
          GH_REPO: softwarity/meerkat
      - name: The images carry the version that was cut
        env:
          CUT: ${{ steps.flow.outputs.version }}
          TAGGED: ${{ steps.next.outputs.version }}
          URL: ${{ steps.flow.outputs.release-url }}
        run: |
          [ "$CUT" = "$TAGGED" ] || { echo "::error::release-flow cut $CUT but the images were tagged $TAGGED - the tags on the registries are wrong, fix them by hand"; exit 1; }
          echo "released $CUT: $URL" | tee -a "$GITHUB_STEP_SUMMARY"
