name: CI

on:
  push:
    # Not the nightly tunnel job: iterating on it means pushing to main, because
    # a workflow_dispatch only exists from the default branch - and a two-line
    # change to a shell script it runs cannot break the product. A commit that
    # touches anything else still runs everything; paths-ignore only skips when
    # EVERY changed file matches.
    paths-ignore:
      - '.github/workflows/plug-hosted.yml'
      - '.github/plug-hosted/**'
    # Every branch except Dependabot's. Its branches arrive WITH a pull
    # request, so `push` and `pull_request` both fire and the whole pipeline
    # runs twice on the same commit - and the push half publishes an image
    # tagged `dependabot-npm_and_yarn-e2e-e2e-3f52c051c4`, which nobody will
    # ever deploy. Ignored here, they are still fully tested as pull requests.
    #
    # Nor `bench`: the latest benchmark the doc site reads (tools/bench), which
    # the Benchmark publication job below pushes to. Testing a branch that holds
    # one JSON file would fail every job - and re-run the benchmark about itself.
    branches-ignore: ["dependabot/**", "bench"]
  pull_request:
  workflow_dispatch:
  # Once a week for what no longer runs on every push: the OIDC directory.
  # Tuesday, a day away from the package prune, so two schedules never explain
  # each other's failures.
  schedule:
    - cron: '23 3 * * 2'

# One pipeline per branch: only the newest commit needs blessing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This file lives in TWO trees and runs in ONE. The private repository,
  # softwarity/meerkat, is where the work lands; the public mirror,
  # softwarity/meerkat-ce, is the same commit with ee/ removed, published by
  # mirror-ce.yml. GitHub bills every minute the private one runs and none the
  # public one runs - so everything runs on the mirror. This pipeline tests
  # the COMMUNITY tree, the one the outside world clones, forks and sends pull
  # requests to, and publishes its image. The Enterprise half - everything
  # built with the ee tag, the suite on PostgreSQL, the LDAP directories, the
  # multi-organisation integration suite, the Enterprise image - is ci-ee.yml,
  # which runs on the mirror too, against the private sources it clones for
  # the occasion.
  #
  # On the private side every job below stands down: the gate is this first
  # one, which everything needs, and a skipped job starts no runner and bills
  # nothing. The community tree is not published blind either: mirror-ce.yml
  # builds and vets it before pushing a single byte.
  #
  # Every job carries a timeout-minutes: GitHub's default is six HOURS, and a
  # hung server or browser holds a runner for every one of them.
  scope:
    name: What this push asks for
    if: github.repository == 'softwarity/meerkat-ce'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # A scheduled run is NOT a pipeline: it exists for the slow check below
      # and everything else stands down. One expression, read by the jobs
      # rather than repeated in each of them.
      full: ${{ github.event_name != 'schedule' }}
      directories: ${{ steps.touched.outputs.directories }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Two commits: enough to see what this push changed.
          fetch-depth: 2
      # The directory suite starts a real server for code that moves rarely -
      # minutes on every commit to answer a question only some commits ask. It
      # runs when its own code moves, on a schedule, or by hand. The net is
      # what its tests compile and start: the driver, the compose file, the
      # module graph.
      - id: touched
        run: |
          base="${{ github.event.before }}"
          if [ "$base" = "0000000000000000000000000000000000000000" ] || [ -z "$base" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "directories=true" >> "$GITHUB_OUTPUT"
            echo "no comparable commit: running them"
            exit 0
          fi
          if git diff --name-only "$base" "${{ github.sha }}" \
             | grep -qE '^(internal/idp/|test/ldap/|go\.(mod|sum)$|\.github/workflows/ci\.yml$)'; then
            echo "directories=true" >> "$GITHUB_OUTPUT"
            echo "this push touches what the directory exercises"
          else
            echo "directories=false" >> "$GITHUB_OUTPUT"
            echo "nothing here reaches the directory: it runs on the schedule"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: scope
    if: needs.scope.outputs.full == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9

  # The console, built ONCE and handed to whoever needs it. It was built twice,
  # in two configurations, for two jobs that both just need the files.
  console:
    name: Console
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: scope
    if: needs.scope.outputs.full == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: console/package-lock.json
      - working-directory: console
        run: npm ci
      # Production, not development: it is what ships, and the integration
      # suite is worth running against the real thing rather than a debug build.
      - working-directory: console
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: console
          path: console/dist/console/browser
          retention-days: 1

  # The doc site, built and thrown away. It ships nowhere near the image, so
  # nothing here needed it - and that was the hole: deploy-doc.yml only runs
  # AFTER a merge to main, so a change that breaks the site is green all the
  # way through review and red once it is too late. A Dependabot pull request
  # raising TypeScript past what Angular accepts passed every check for
  # exactly that reason.
  docs:
    name: Doc site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: scope
    if: needs.scope.outputs.full == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gen-version.mjs resolves the latest tag
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - working-directory: docs
        run: npm ci
      - working-directory: docs
        run: npm run build -- --base-href /

  # The Go side in ONE job: vet, the tests, and the two static builds. It was
  # three jobs - The packages, Whole tree, Builds for both architectures - each
  # paying its own checkout, cache restore and compilation of the same graph.
  #
  # ./internal and ./cmd under the race detector: the concurrency in those
  # packages is the same code in both editions, and this is where it is
  # watched. No ./ee/...: that tree is this commit with ee/ REMOVED, and naming
  # it here is `FAIL ./ee/... [setup failed]`.
  #
  # The builds: static, no CGO, amd64 and arm64. Linux only, and that is the
  # whole target - Meerkat ships as an image.
  unit:
    name: Go - vet, tests, builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: scope
    if: needs.scope.outputs.full == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./internal/... ./cmd/...
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          for goarch in amd64 arm64; do
            echo "building linux/$goarch"
            GOARCH=$goarch go build -trimpath -ldflags '-s -w' -o /dev/null ./cmd/meerkat
          done

  # The comparative benchmark (tools/bench): Meerkat and Kong, APISIX and
  # Traefik in their free editions, plus the Go standard library's bare proxy as
  # a reference, each pinned to one CPU in front of the same upstream, under the
  # same load, in the same run.
  #
  # On the two machines a public repository gets for free: 4 CPUs and 16 GB on
  # x64 AND on arm64. The CPU model is not documented and varies, so the run
  # records its own (lscpu) beside its figures - a number without its machine
  # is not a number.
  #
  # Main only, or by hand: a point per commit is the evolution, and a pull
  # request would publish a point for code that may never land.
  bench:
    name: Benchmark (${{ matrix.arch }})
    timeout-minutes: 30
    needs: scope
    if: >-
      (github.event_name == 'push' && github.ref_name == 'main') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run
        env:
          RUNNER_LABEL: ${{ matrix.runner }}
        run: tools/bench/run.sh
      - name: Summary
        if: always()
        run: |
          if [ -f tools/bench/out/summary.md ]; then
            cat tools/bench/out/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.arch }}
          path: tools/bench/out/results.json
          if-no-files-found: error

  # Both machines' latest results as ONE file on the `bench` branch, which the
  # doc site's Performance page fetches on every visit. Only the latest run is
  # kept - a history nobody reads is a file that grows - so the branch is
  # rewritten each time as a single commit.
  bench-publish:
    name: Benchmark publication
    timeout-minutes: 5
    needs: bench
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: bench-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bench-*
          path: runs
      - name: Publish the latest run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/latest
          jq -s '{schema: 1, runs: .}' runs/*/results.json > /tmp/latest/latest.json
          cd /tmp/latest
          git init -q -b bench
          git add latest.json
          git -c user.name="softwarity-bot" -c user.email="bot@softwarity.io" \
            commit -q -m "Benchmark of ${GITHUB_SHA:0:7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:bench

  # The OIDC driver, against the real thing. test/ldap brings up Dex; without
  # it the test SKIPS, and a skip is silent - `ok internal/idp` was being
  # reported for tests that never ran. The two LDAP directories need the
  # Enterprise driver and run in ci-ee.yml.
  #
  # Ubuntu only: Docker is not dependable on the macOS and Windows runners, and
  # interoperability with a directory does not vary by client OS.
  directory:
    name: OIDC (Dex)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: scope
    # What this exercises moves rarely: when its own code moves, when somebody
    # asks, and once a week whatever happens.
    if: >-
      needs.scope.outputs.directories == 'true'
      || github.event_name != 'push'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Start Dex
        working-directory: test/ldap
        run: docker compose up -d dex
      # A skipped test PASSES, so counting is the only thing that tells "it
      # ran" from "nothing answered and nobody noticed".
      - name: Run against it, and prove it ran
        run: |
          go test ./internal/idp/ -run 'TestOIDCAgainstDex' -count=1 -v 2>&1 | tee out.txt
          ran=$(grep -c -- '--- PASS' out.txt)
          echo "$ran of 1 expected tests ran against Dex"
          [ "$ran" -eq 1 ] || { echo "the server was not reached"; exit 1; }
      - if: always()
        working-directory: test/ldap
        run: docker compose down -v

  # Integration: a real gateway + the built console, driven by Playwright over
  # the seeded profiles of e2e/scenarios.json (positive AND negative access).
  # The suite asks the tree what it can build: without ee/ it drives the
  # community product on the single organisation every installation serves,
  # and the handful of scenarios that need several organisations carry
  # `edition: "ee"` in scenarios.json and are left out - the difference is
  # declared in the matrix, where it can be read, rather than hidden in a
  # workflow condition. A pull request here is worth nothing if the
  # integration suite does not run on it.
  e2e:
    name: Integration (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [scope, console]
    if: needs.scope.outputs.full == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Take the console that was already built
        uses: actions/download-artifact@v8
        with:
          name: console
          path: console/dist/console/browser
      # The browser is 130 MB downloaded on every single run, and it changes
      # only when Playwright does - which the lock file says exactly.
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # Playwright transpiles the specs without checking them, so a suite can
      # be green with a tsconfig that no longer compiles - which is exactly
      # what a TypeScript major did here, and nothing said a word.
      - name: Type-check the specs
        working-directory: e2e
        run: npx tsc --noEmit
      - name: Run integration suite
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report

  # The community image, once everything is green: `latest` from main, and
  # only from main - any other branch is tested, not published. Off PRs.
  #
  # AUTOMATIC on every push to main, and on demand (`gh workflow run CI --ref
  # main -R softwarity/meerkat-ce`). Its Docker Hub token is an Actions
  # secret, which a fork's pull request never receives. A release publishes
  # the semver tags from ci-ee.yml, which is the one that knows the version:
  # this tree has no tags.
  #
  # THE GATE. A skipped job skips its dependants, and some needs are skipped
  # on purpose - the directory when its code did not move. So the condition
  # names what must have PASSED and refuses any failure, rather than asking
  # every need to have run.
  image:
    name: Build & publish image
    needs: [scope, lint, unit, directory, e2e, console]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure')
      && needs.lint.result == 'success' && needs.unit.result == 'success'
      && needs.e2e.result == 'success'
      && ((github.event_name == 'push' && github.ref_name == 'main') || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    # Without this the registry credentials never reach the reusable workflow:
    # a called workflow gets no repository secret unless the caller passes it,
    # and the preflight would report "not set" forever.
    secrets: inherit
    uses: ./.github/workflows/_docker.yml
    with:
      image: docker.io/softwarity/meerkat
