name: Docker release

# Triggered by version tags created by the Release workflow: build and publish
# the released image (semver tags) via the shared multi-arch workflow.
#
# A released image must be as blessed as :latest - the gate waits for the CI
# run of this very commit and refuses to publish on anything but green
# (pattern shared with softwarity/plug).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read # the gate reads this commit's CI run

jobs:
  gate:
    name: wait for this commit's CI to be green
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ github.sha }}"
          for _ in $(seq 1 30); do
            read -r st cc < <(gh run list --repo "$GITHUB_REPOSITORY" --workflow=ci.yml \
              --commit "$sha" --limit 1 --json status,conclusion \
              --jq '.[0] | "\(.status) \(.conclusion // "")"' 2>/dev/null || echo "none ")
            case "$st $cc" in
              "completed success")
                echo "CI is green for $sha - publishing"
                exit 0 ;;
              "completed "*)
                echo "::error::CI concluded '$cc' for $sha - refusing to publish the release image. Re-run the CI on this commit, then re-run this workflow."
                exit 1 ;;
            esac
            echo "CI for $sha: ${st:-no run yet} - waiting"
            sleep 60
          done
          echo "::error::timed out waiting for this commit's CI run"
          exit 1

  image:
    name: Build & publish image
    needs: gate
    permissions:
      contents: read
      # Granted, not used: a called workflow cannot request more than its
      # caller allows, and the shared definition asks for it so the
      # Enterprise side can push to GH Packages.
      packages: write
    # Without this the registry credentials never reach the reusable workflow:
    # a called workflow gets no repository secret unless the caller passes it,
    # and the preflight would report "not set" forever.
    secrets: inherit
    uses: ./.github/workflows/_docker.yml
    with:
      image: docker.io/softwarity/meerkat
      registry: docker.io
      go-tags: ""

  # The Enterprise image, same commit, private registry. It is the artifact
  # that IS the licence: what separates it from the one above is the code the
  # linker put in it, not a flag it reads.
  image-ee:
    name: Build & publish the Enterprise image
    permissions:
      contents: read
      packages: write
    needs: gate
    secrets: inherit
    uses: ./.github/workflows/_docker.yml
    with:
      image: ghcr.io/softwarity/meerkat-ee
      registry: ghcr.io
      go-tags: ee
