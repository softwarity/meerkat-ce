# Meerkat, seeded on first start (-config). Three routes, the same three every
# gateway of the benchmark carries, in front of the same upstream.
#
#   /proxy  anonymous, nothing but the proxy
#   /auth   a personal API token (Bearer mk_...) resolved by the gateway, and
#           the caller forwarded as HEADERS - X-Consumer-Username and
#           X-Consumer-ID, what Kong's and APISIX's key-auth send - and NO
#           roles, which neither of them forwards: like for like
#   /auth-jwt the same token, the caller forwarded as an ES256-signed JWT
#           instead: what Meerkat usually does in production, and nothing the
#           others do here, measured apart to show what the signature costs.
#           The roles attribute is there, but the bench account holds no role,
#           so no list rides in the token either
#   /limit  anonymous, a rate limit per address set far above what the run
#           sends, so what is measured is the cost of counting, not a refusal
version: 1
routes:
  - id: proxy
    name: proxy
    enabled: true
    order: 100
    upstream: http://upstream:9000
    isUi: false
    predicates:
      - type: path
        args:
          patterns:
            - /proxy/**
  - id: auth
    name: auth
    enabled: true
    order: 110
    upstream: http://upstream:9000
    isUi: false
    access:
      level: auth
    identity:
      mechanism: headers
      attributes:
        - field: username
          as: X-Consumer-Username
        - field: userid
          as: X-Consumer-ID
    predicates:
      - type: path
        args:
          patterns:
            - /auth/**
  - id: auth-jwt
    name: auth-jwt
    enabled: true
    order: 115
    upstream: http://upstream:9000
    isUi: false
    access:
      level: auth
    identity:
      mechanism: signed-jwt
      algorithm: ES256
      attributes:
        - field: username
        - field: roles
    predicates:
      - type: path
        args:
          patterns:
            - /auth-jwt/**
  - id: limit
    name: limit
    enabled: true
    order: 120
    upstream: http://upstream:9000
    isUi: false
    limits:
      - per: ip
        requests: 100000000
        window: PT1M
    predicates:
      - type: path
        args:
          patterns:
            - /limit/**
