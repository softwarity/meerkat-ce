# Two authorities to test against, because LDAP and Active Directory only
# LOOK alike: AD binds with a UPN or DOMAIN\user, keys people on
# sAMAccountName, exposes memberOf, and resolves nested groups with its own
# matching rule. A client that only ever met OpenLDAP breaks on all four.
#
#   make ldap-up      start both, seeded
#   make ldap-test    run the integration tests against them
#   make ldap-down    stop and forget
services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: meerkat-openldap
    command: --copy-service
    environment:
      LDAP_ORGANISATION: "Example Inc."
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "adminpassword"
      LDAP_TLS: "false"
    ports:
      - "3389:389"
    volumes:
      - ./openldap/init.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/init.ldif:ro
    # Two rhythms, and the second one is the one that matters on a laptop: a
    # probe every few seconds is right while `make ldap-up` is waiting for the
    # thing to come up, and wrong for the rest of the day. `interval` never
    # stops - a bench left running was probing more often than every other
    # container on this machine put together, and each probe is a process spawn
    # through the VM, which is what actually costs.
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "dc=example,dc=com", "-D", "cn=admin,dc=example,dc=com", "-w", "adminpassword"]
      start_period: 60s
      start_interval: 2s
      interval: 60s
      timeout: 5s
      retries: 3

  # A real OIDC provider: Dex, static Go, no database, no JVM. Meerkat exists
  # so that an installation does NOT have to run an identity server; the test
  # bench should not contradict that with half a gigabyte of Keycloak.
  dex:
    image: dexidp/dex:latest
    container_name: meerkat-dex
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:5556/dex/.well-known/openid-configuration"]
      start_period: 30s
      start_interval: 2s
      interval: 60s
      timeout: 5s
      retries: 3

  # A real Active Directory domain controller (Samba 4 in AD DC mode). It
  # provisions on first start, which takes about a minute; the seed script
  # then adds the same people and the same nested groups as the OpenLDAP
  # side, so one test suite can assert against both.
  samba:
    image: diegogslomp/samba-ad-dc:latest
    container_name: meerkat-samba-ad
    hostname: dc1
    domainname: ad.example.com
    privileged: true
    environment:
      REALM: AD.EXAMPLE.COM
      DOMAIN: ADEXAMPLE
      ADMIN_PASS: "Passw0rd!2026"
      DNS_FORWARDER: 1.1.1.1
      # Under Docker Desktop the image picks the wrong interface and ends up
      # listening on the loopback only, so the published ports reach nothing.
      # The image documents this switch for exactly that case.
      BIND_NETWORK_INTERFACES: "false"
    ports:
      - "3390:389"
      - "3636:636"
    volumes:
      - ./samba/seed.sh:/seed.sh:ro
    # The provisioning takes about a minute on a cold start, hence the long
    # start_period; samba-tool is a Python program, so the steady-state probe is
    # the most expensive one of the three and the one that most deserves to be
    # rare.
    healthcheck:
      test: ["CMD-SHELL", "samba-tool domain info 127.0.0.1 >/dev/null 2>&1"]
      start_period: 240s
      start_interval: 5s
      interval: 120s
      timeout: 10s
      retries: 3
