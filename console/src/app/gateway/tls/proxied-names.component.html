<div class="row">
  <mat-form-field subscriptSizing="dynamic">
    <mat-label i18n="@@Proxied_names_label">Names the proxy presents</mat-label>
    <!-- The input lives INSIDE the grid so it flows on the chips' line. -->
    <mat-chip-grid #grid>
      @for (n of names(); track n) {
        <mat-chip-row (removed)="remove(n)">
          {{ n }}
          <button matChipRemove type="button" [attr.aria-label]="n">
            <mat-icon>cancel</mat-icon>
          </button>
        </mat-chip-row>
      }
      <input
        [matChipInputFor]="grid"
        [matChipInputSeparatorKeyCodes]="separators"
        matChipInputAddOnBlur
        (matChipInputTokenEnd)="add($event)"
        [placeholder]="names().length ? '' : 'shop.example.com'"
      />
    </mat-chip-grid>
  </mat-form-field>
  <!-- Beside the field, as app-form-field does it: an explanation, not an
       action on the value. Focusable, so the tooltip reaches a keyboard. -->
  <button
    type="button"
    class="field-info"
    [matTooltip]="info"
    matTooltipPositionAtOrigin
    i18n-aria-label="@@More_information"
    aria-label="More information"
    (click)="$event.preventDefault()"
  ><mat-icon>info</mat-icon></button>
</div>
