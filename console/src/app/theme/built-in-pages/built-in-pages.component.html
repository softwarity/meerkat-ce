@if (scope.loading()) {
  <loading-indicator withContainer />
} @else {
  <div class="layout">
    <div class="left">
      <nav mat-tab-nav-bar [tabPanel]="panel" mat-stretch-tabs="false">
        <a
          mat-tab-link
          routerLink="theme"
          routerLinkActive
          #tTheme="routerLinkActive"
          [active]="tTheme.isActive"
          i18n="@@Theme"
          >Theme</a
        >
        <a
          mat-tab-link
          routerLink="layout"
          routerLinkActive
          #tLayout="routerLinkActive"
          [active]="tLayout.isActive"
          i18n="@@Layout"
          >Layout</a
        >
        <a
          mat-tab-link
          routerLink="branding"
          routerLinkActive
          #tBrand="routerLinkActive"
          [active]="tBrand.isActive"
          i18n="@@Branding"
          >Branding</a
        >
        <a
          mat-tab-link
          routerLink="locale"
          routerLinkActive
          #tLocale="routerLinkActive"
          [active]="tLocale.isActive"
          i18n="@@Locale"
          >Locale</a
        >
      </nav>
      <mat-tab-nav-panel #panel>
        <router-outlet />
      </mat-tab-nav-panel>
    </div>

    <div class="preview">
      <!-- What the panes are showing, above them; the theme picker rides in the
           gap between them. One chooses the palette, the other the page. -->
      <app-template-picker
        [templates]="scope.shownTemplates()"
        [categories]="scope.categories()"
        [only]="scope.only()"
        [selected]="scope.template()"
        (pick)="scope.template.set($event.key)"
        (filter)="scope.setCategories($event)"
      />
      <!-- One preview for the three tabs, and the theme picker in the gap
           between its two panes (see theme-carousel). -->
      <app-theme-preview
        [themeId]="scope.selectedId()"
        [version]="scope.version()"
        [dark]="scope.dark()"
        [light]="scope.light()"
        [flat]="scope.flat()"
        [brandName]="scope.appName()"
        [brandTagline]="scope.tagline()"
        [brandLogo]="scope.logo()"
        [brandLogoSize]="scope.logoSize()"
        [background]="scope.bg()"
        [highlight]="scope.highlightVar()"
        [draft]="scope.draft()"
        [pagesScheme]="scope.pagesScheme()"
        [layout]="scope.layout()"
        [template]="scope.template()"
        [locale]="scope.previewLocale()"
        [allErrors]="onLocaleTab()"
      >
        @if (onLocaleTab()) {
          <app-locale-picker
            [locales]="scope.locales()"
            [selected]="scope.previewLocale()"
            (pick)="scope.previewLocale.set($event)"
            (add)="addLocale()"
          />
        } @else {
          <app-theme-carousel
            [themes]="scope.themes()"
            [presets]="scope.presets()"
            [selectedId]="scope.selectedId()"
            (pick)="scope.select($event)"
            (activateTheme)="scope.activate($event)"
          />
        }
      </app-theme-preview>
    </div>
  </div>
}
