<rail-nav-container>
  <rail-nav title="meerkat" subtitle="console">
    <rail-nav-item
      i18n-label="@@Infra"
      label="Infra"
      routerLink="/infra"
      [active]="inInfra()"
      any-role="root infra-admin"
    >
      <mat-icon>dns</mat-icon>
    </rail-nav-item>
    <rail-nav-item
      i18n-label="@@Application"
      label="Application"
      routerLink="/application"
      [active]="inApp()"
      any-role="root app-admin"
    >
      <mat-icon>tune</mat-icon>
    </rail-nav-item>
    <!-- Organisations only exist as a notion in multi mode: in single there is
         one, it is never named, and Groups / Members / Rules live under
         Application instead. -->
    <rail-nav-item
      i18n-label="@@Tenants"
      label="Tenants"
      [for]="tenantsDrawer"
      [active]="inTenants()"
      (click)="openTenants()"
      any-role="root tenant-admin tenant-creator"
      multi-tenant-only
    >
      <mat-icon>domain</mat-icon>
    </rail-nav-item>
    <rail-nav-item
      i18n-label="@@API"
      label="API"
      routerLink="/api"
      [active]="inApiDocs()"
      any-role="root infra-admin app-admin"
    >
      <mat-icon>api</mat-icon>
    </rail-nav-item>
    <rail-nav-item
      i18n-label="@@Vault"
      label="Vault"
      routerLink="/vault"
      [active]="inVault()"
      any-role="root infra-admin app-admin"
    >
      <mat-icon>key</mat-icon>
    </rail-nav-item>
    <rail-nav-item
      i18n-label="@@Audit"
      label="Audit"
      routerLink="/audit"
      [active]="inAudit()"
      any-role="root infra-admin app-admin tenant-admin"
    >
      <mat-icon>history_edu</mat-icon>
    </rail-nav-item>
    <rail-nav-separator />
    <!-- Below the line: what is about the APPLICATION rather than about
         Meerkat. The vault and the audit above say what this gateway holds and
         what was done to it; these three say what the thing it serves is
         doing. -->
    <rail-nav-item
      i18n-label="@@Scheduler"
      label="Scheduler"
      routerLink="/scheduler"
      [active]="inScheduler()"
      any-role="root app-admin"
    >
      <mat-icon>schedule</mat-icon>
    </rail-nav-item>
    <rail-nav-item
      i18n-label="@@Metrics"
      label="Metrics"
      routerLink="/traffic"
      [active]="inMetrics()"
      any-role="root infra-admin"
    >
      <mat-icon>monitoring</mat-icon>
    </rail-nav-item>
    <rail-nav-item
      i18n-label="@@Issues"
      label="Issues"
      routerLink="/issues"
      [active]="inIssues()"
      any-role="root infra-admin app-admin tenant-admin"
    >
      <mat-icon>bug_report</mat-icon>
    </rail-nav-item>
    <rail-nav-spacer />
    <!-- Whether the socket this tab watches everything on is up (CONSOLE-13).
         ONE indicator, here and not per screen, because there is one socket:
         it says the screens are following what other people do, and clicking it
         reconnects now instead of waiting out the delay. It is also why no
         screen carries a Refresh button any more - a control offering to fetch
         the list again implies that the rest of the time you are looking at
         something stale. -->
    <lw-live-indicator
      class="rail-live"
      i18n-title="@@Live_channel_title"
      title="Live channel: the screens follow what other people change. Click to reconnect."
    />
    <app-user-menu />
  </rail-nav>
  <rail-nav-content>
    <router-outlet />
  </rail-nav-content>
</rail-nav-container>

<!-- Tenants: drill into a single org's options (members, hours, TTL...).
     Creation happens right here - there is no tenant list page. -->
<ng-template #tenantsDrawer>
  <button matButton="tonal" class="drawer-action" (click)="createTenant()" any-role="root tenant-creator">
    <mat-icon>add</mat-icon>
    <ng-container i18n="@@New_tenant">New tenant</ng-container>
  </button>
  @for (t of tenants(); track t.id) {
    <a [routerLink]="['/tenants', t.id]" routerLinkActive="active" class="drawer-item">
      <mat-icon>domain</mat-icon>
      <span class="drawer-lines">
        <span>{{ t.name }}</span>
        @if (t.description) {
          <span class="drawer-desc">{{ t.description }}</span>
        }
      </span>
    </a>
  } @empty {
    <span class="drawer-empty" i18n="@@No_tenant_yet">No tenant yet</span>
  }
</ng-template>
