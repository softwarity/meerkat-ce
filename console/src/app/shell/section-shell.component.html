@if (sections.length) {
  <nav class="left">
    <h2>{{ title }}</h2>
    @for (s of sections; track s.path) {
      @if (s.bottom) {
        <span class="spacer"></span>
      }
      <a
        [routerLink]="s.path"
        routerLinkActive="active"
        class="section-link"
        [attr.any-role]="s.roles || null"
        [attr.single-tenant-only]="s.singleOnly ? '' : null"
        [attr.plug-open-only]="s.plugOnly ? '' : null"
        [attr.ee-feature]="s.ee?.feature ?? null"
      >
        <mat-icon
          matBadgeSize="small"
          [matBadge]="badge(s)"
          [matBadgeHidden]="badge(s) === 0"
          >{{ s.icon }}</mat-icon
        >
        <span>{{ s.label }}</span>
        @if (s.ee) {
          <app-ee-lock [feature]="s.ee.feature" [why]="s.ee.why" />
        }
      </a>
    }
  </nav>
}
<div class="right">
  <router-outlet />
</div>
