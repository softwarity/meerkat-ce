@if (loading()) {
  <loading-indicator withContainer />
} @else {
  <div class="banner">
    <h1 i18n="@@Section_general">General</h1>
  </div>

  <div class="content">
    <!-- The mode, where the consequence is visible: this is the screen of the
         application whose organisations it serves. It is a real switch, not a
         teaser - locked in the community edition, and the one place the offer
         is mentioned outside the License screen. -->
    <mat-card appearance="outlined" ee-feature="multi-tenant">
      <div class="tenancy">
        <mat-icon>domain</mat-icon>
        <div class="grow">
          <div class="title">
            <ng-container i18n="@@Several_organisations">Several tenants</ng-container>
            <app-ee-lock
              feature="multi-tenant"
              i18n-why="@@Multi_tenant_ee_why"
              why="Isolate tenants, each with its own groups, members and hours."
            />
          </div>
          <p class="hint text-muted" i18n="@@Several_organisations_hint">
            Off: a single tenant, managed here. On: each tenant is managed under Tenants.
          </p>
        </div>
        <mat-slide-toggle
          [checked]="multiTenant()"
          [disabled]="switching()"
          (change)="setTenancy($event.checked)"
        />
      </div>
    </mat-card>

    <mat-card appearance="outlined" ee-feature="business-hours">
      <h3 i18n="@@Working_hours">
        Working hours
        <app-ee-lock
          feature="business-hours"
          i18n-why="@@Working_hours_ee_why"
          why="Allow access only during set hours, for everyone or per person."
        />
      </h3>
      <p class="hint text-muted" i18n="@@Working_hours_global_hint">
        Apply to every tenant that has no hours of its own.
      </p>
      <app-business-access-form
        [value]="businessAccess()"
        [topLevel]="true"
        (valueChange)="businessAccess.set($event)"
      />
      <!-- It saves the hours and nothing else (the switches above apply on
           click), so it sits in their card and locks with it. -->
      <div class="flex justify-end">
        <button matButton="filled" (click)="save()" [disabled]="saving()" i18n="@@Save">Save</button>
      </div>
    </mat-card>
  </div>
}
