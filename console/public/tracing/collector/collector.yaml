# The OpenTelemetry Collector's configuration: the ONE address every producer
# sends to (OTLP on 4318 and 4317), and where each signal goes from there.
#
#   traces   -> Tempo (or Jaeger), sorted once complete (tail sampling)
#   metrics  -> Prometheus, over its OTLP receiver
#   logs     -> Loki; the audit is kept apart by meerkat.stream
#
# Change the three addresses under `exporters` to yours. Image:
# otel/opentelemetry-collector-contrib (the distribution with tail sampling and
# the transform processor).

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch: {}
  # Producers send 100% of their traces; what is kept is decided here, once
  # each is complete: every error, every slow one, a share of the rest. All
  # the spans of one trace must reach the same Collector - fine with one.
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 1000
      - name: a-share-of-the-rest
        type: probabilistic
        probabilistic:
          sampling_percentage: 10
  # Meerkat marks its audit records meerkat.stream=audit; anything unmarked is
  # an application log. Loki indexes it: its own query, its own retention.
  transform/stream:
    log_statements:
      - context: resource
        statements:
          - set(attributes["meerkat.stream"], "logs") where attributes["meerkat.stream"] == nil

exporters:
  otlphttp/traces:
    endpoint: http://tempo:4318
  otlphttp/metrics:
    # Prometheus 3, started with --web.enable-otlp-receiver.
    endpoint: http://prometheus:9090/api/v1/otlp
  otlphttp/logs:
    # Loki 3's native OTLP endpoint.
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlphttp/traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/metrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/stream, batch]
      exporters: [otlphttp/logs]
