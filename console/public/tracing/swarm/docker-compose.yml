# docker stack deploy -c tracing-compose.yml tracing

services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      # Where the traces are kept. badger writes to disk and survives a
      # restart; the default keeps them in memory, which is a demonstration
      # rather than an installation.
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
      # Behind a route, the UI still has to know the public URL it answers
      # under - the gateway strips the prefix, it does not rewrite its links.
      QUERY_BASE_PATH: /jaeger
    volumes: [jaeger_data:/badger]
    networks: [meerkat]
    # NO published port, and that is deliberate rather than an omission: the
    # gateway reaches the collector on 4318 over this network, and a person
    # reaches the UI through a route on the gateway - path /jaeger/**,
    # strip-prefix 1, upstream http://jaeger:16686, marked as a UI route. Your
    # traces are then behind the sign-in you already have instead of behind a
    # second door somebody has to remember to protect.

networks:
  # The network the gateway is already on. `docker network ls` names it, and
  # the console shows the one it found (Metrics, the Prometheus panel).
  meerkat:
    external: true

volumes:
  jaeger_data:

# Then, in the console: Infra, OpenTelemetry. Set the collector address to
# http://jaeger:4318 - the service name on this network, over OTLP - and press
# Test: it posts an empty batch and says what answered.
#
# WHEN THIS IS NOT ENOUGH, which is the day you have more than one thing
# sending traces: put an OpenTelemetry Collector in front, point everything at
# it, and let it fan out. The Collector is what sampling, filtering and
# changing backend without touching an application live in. Meerkat speaks
# OTLP to either, and nothing on this page changes.
